<!doctype html>
<!--
 PeriGest — histórico de releases (para distinguir versões dos HTML gerados):
  rel 2.6 — este ficheiro: renomeações (Pedidos de serviço, Número institucional do
   processo, Resumo de situações a analisar), cabeçalho de 3 linhas com traço entre a
   2ª e a 3ª, traço acima do rodapé, entidades representadas movidas para o interveniente,
   classificação em terços da questão + pendentes de custos, filtro global de pendentes
   por processo/perito, documentação do processo com upload de ficheiros, eventos com
   Comunicações/hora/anotações/constrangimentos integrados na cronologia, relatório final
   com bloco de assinatura, correção da pré-visualização de PDF em iPhone/iPad, e regras
   permanentes de espaçamento inferior (faixa publicitária) e alvo de toque maior.
  rel 2.5 — versão anterior (base recebida).
-->
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PeriGest 2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{--b:#2b4c8c;--g:#2f9161;--r:#a62c2c;--amber:#c88a15;--bg:#eef1f6;--ln:#d7dde3;--ink:#1f2933;--muted:#637381;--card:#fff}
*{box-sizing:border-box}
/* Regra permanente: a app abre dentro de um invólucro com faixa publicitária fixa no
   fundo do ecrã (sobretudo iPhone) — mantemos sempre uma folga grande e alvos de toque
   maiores no fundo, e evitamos ações críticas coladas à última linha visível. */
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);padding-bottom:calc(120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:6;background:#132a52;color:#fff;padding:7px 14px}
header h1{margin:0;font-size:17px;display:flex;align-items:center;gap:7px}
header .rel{font-size:10.5px;background:#26407a;padding:2px 7px;border-radius:10px;font-weight:600}
header .ctx{opacity:.9;font-size:11.5px;margin-top:2px}
nav.tabbar{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--ln)}
nav.tabbar button{min-height:38px;padding:7px 10px;font-size:12.5px}
.crumbbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--ln);font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumbbar button{width:auto;min-height:32px;padding:5px 10px;font-size:12.5px}
main{max-width:880px;margin:auto;padding:12px;padding-bottom:64px}
/* Régua/CTA de destaque (ex.: aceder aos processos): mais alta, cor de aviso e afastada
   do fundo do ecrã — regra reutilizável para qualquer botão-régua semelhante. */
.ruler{min-height:60px;font-size:16px;margin-top:18px;margin-bottom:36px;background:var(--amber);color:#3a2a00}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 7px #0000000d}
.card h2{margin:0 0 10px;font-size:16px}
.card h3{margin:14px 0 8px;font-size:14px;color:var(--b)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.actions.one{grid-template-columns:1fr}
.actions.three{grid-template-columns:repeat(3,1fr)}
.actions.four{grid-template-columns:repeat(4,1fr)}
label{display:block;font-weight:700;font-size:13.5px;margin:10px 0 5px}
label.inline{display:flex;align-items:center;gap:8px;font-weight:400;margin:8px 0}
input,select,textarea{width:100%;padding:11px;border:1px solid #b8c2cc;border-radius:8px;font:inherit;font-size:16px;background:#fff}
input[type="checkbox"]{width:auto;flex:0 0 auto}
input[type="date"],input[type="time"]{min-height:48px;font-size:17px}
textarea{min-height:70px;resize:vertical}
/* Regra permanente: botões com altura maior do que o mínimo do browser, para sobrarem
   alvos de toque confortáveis por cima da faixa publicitária do fundo do ecrã. */
button{border:0;border-radius:9px;padding:10px 12px;min-height:48px;background:var(--b);color:#fff;font-weight:700;font:inherit;font-size:14px;cursor:pointer;line-height:1.25}
.secondary{background:#5b6b7d}
.green{background:var(--g)}
.amber{background:var(--amber)}
.danger{background:var(--r)}
.linklike{background:none;border:0;padding:0;min-height:auto;color:var(--b);text-decoration:underline;font-weight:600;font-size:12.5px;cursor:pointer}
.fieldlink{display:flex;align-items:center;gap:8px}
.fieldlink select{flex:1}
.status{padding:9px 10px;background:#f5f7f9;border:1px solid var(--ln);border-radius:8px;color:var(--muted);font-size:13px;margin:8px 0}
.note{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11.5px;font-weight:700;color:#fff;margin-left:6px}
.pill.on{background:var(--g)}
.pill.off{background:var(--r)}
.pill.end{background:#5b6b7d}
.pill.sby{background:var(--amber);color:#3a2a00}
.pill.analise{background:var(--amber)}
.pill.relatorio{background:var(--b)}
.item{border:1px solid var(--ln);border-radius:10px;padding:11px;margin:8px 0;cursor:pointer;background:#fbfcfd}
.item:active{background:#f0f3f7}
.item b{display:block;font-size:14.5px}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.item-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.item-actions button{width:auto;min-width:0;padding:6px 12px;font-size:12.5px;min-height:34px}
.block-title{margin:22px 0 10px;padding:9px 12px;background:#132a52;color:#fff;border-radius:9px;font-size:14.5px;font-weight:800}
.block-title:first-of-type{margin-top:4px}
hr{border:0;border-top:1px solid var(--ln);margin:14px 0}
.grid-cols{display:grid;gap:8px}
.photo-cell{border:1px solid var(--ln);border-radius:10px;background:#fafbfc;padding:6px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:4px}
.photo-cell img{width:100%;height:120px;object-fit:cover;object-position:center;border-radius:7px;display:block;cursor:pointer;background:#e3e8ee}
.photo-cell .seq{font-size:11px;font-weight:700;color:var(--b);text-align:left}
.photo-cell .cap{font-size:11.5px;color:var(--muted);text-align:left;word-break:break-word}
.photo-cell .flag{font-size:11px;color:var(--r);font-weight:700}
.photo-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.photo-actions button{width:auto;min-height:28px;padding:4px 8px;font-size:11px}
.modal-overlay{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#fff;border-radius:14px 14px 0 0;padding:16px;width:100%;max-width:640px;max-height:92vh;overflow:auto}
@media(min-width:640px){.modal-overlay{align-items:center}.modal-box{border-radius:14px}}
.modal-box img.big{width:100%;max-height:46vh;object-fit:contain;border-radius:10px;background:#eee;margin-bottom:10px}
.hidden{display:none!important}
.searchbar{position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:3}
.order-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--ln);border-radius:9px;padding:9px 11px;margin:6px 0;background:#fbfcfd}
.order-row .lbl{font-weight:600;font-size:13.5px}
.order-btns{display:flex;gap:6px}
.order-btns button{width:auto;min-width:0;min-height:36px;padding:6px 12px;font-size:14px}
.justify{text-align:justify}
.preview-frame{width:100%;height:60vh;border:1px solid var(--ln);border-radius:9px;background:#f7f8fa}
.stat-tile{text-align:center;padding:7px 5px;background:#f5f7f9;border:1px solid var(--ln);border-radius:9px}
.stat-tile b{display:block;font-size:18px;color:var(--b);line-height:1.15}
.stat-tile span{font-size:10.5px;color:var(--muted)}
.pending-group h3{margin:14px 0 6px}
@media(max-width:620px){.row,.row3{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions.three{grid-template-columns:1fr 1fr}.actions.four{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<header>
<h1>🧭 PeriGest <span class="rel" id="relBadge">v2 · rel 2.6</span></h1>
<div class="ctx" id="headCtx">Sem contexto ativo</div>
</header>
<nav class="tabbar">
<button type="button" data-action="goHome">🏠 Pedidos &amp; Processos</button>
<button type="button" class="secondary" data-action="goSettings">⚙️ Configurações</button>
</nav>
<div class="crumbbar" id="crumbbar"></div>
<main id="main"></main>

<script>
/* ===================== Estado / Persistência ===================== */
const LS_KEY='perigest_v2_state';
const DB_NAME='perigest_v2_photos', STORE='photos', FILES_STORE='files';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function pad(n,l){n=String(n);while(n.length<(l||2))n='0'+n;return n}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function todayISO(){return new Date().toISOString().slice(0,10)}
// iPhone/iPad: o Safari nem sempre respeita <a download> em URLs blob, e não faz uma
// pré-visualização de PDF fiável dentro de <iframe> — por isso vários pontos da app
// (pré-visualização e exportações) adaptam-se quando este helper devolve true.
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}

// Campos orientáveis (ordem configurável) de cada formulário principal.
const FIELD_DEFS={
 pedido:[['codigo','Código provisório'],['solicitante','Solicitante'],['contacto','Contacto telefónico'],['email','E-mail'],['dataPedido','Data do pedido'],['prazo','Prazo'],['servicoId','Serviço solicitado'],['finalidadeId','Finalidade'],['assunto','Situação a analisar'],['local','Local']],
 processo:[['codigo','Código de processo'],['numero','Nº processo (institucional)'],['solicitanteInstitucional','Solicitante institucional'],['designacaoInstitucional','Contexto'],['designacaoTag','Designação TAG'],['local','Local'],['assunto','Resumo de situações a analisar'],['siglaId','Sigla das questões'],['coordenadorId','Coordenador do processo'],['designacaoQuestaoId','Designação processual das questões']],
 questao:[['numero','Número na sequência do autor'],['siglaId','Sigla'],['referencia','Referência/código do autor (livre)'],['descricaoResumida','Descrição resumida'],['descricaoCompleta','Descrição completa']]
};
function defaultFieldOrder(){
 const o={};
 Object.keys(FIELD_DEFS).forEach(k=>{o[k]=FIELD_DEFS[k].map(f=>f[0])});
 return o;
}
// Mais hipóteses de fonte de texto sem engordar o código: o Word (.docx) apenas referencia
// o nome da fonte instalada no sistema (não a embebe), pelo que aceita qualquer nome sem
// custo nenhum; o jsPDF só tem 3 fontes base embutidas (helvetica/times/courier), por isso
// cada opção é mapeada para a base mais próxima só para a geração do PDF.
const FONT_OPTIONS=[
 ['helvetica','Helvetica / Arial'],['times','Times New Roman'],['courier','Courier New'],
 ['georgia','Georgia'],['verdana','Verdana'],['calibri','Calibri'],['garamond','Garamond'],
 ['cambria','Cambria'],['trebuchet','Trebuchet MS']
];
const FONT_DOCX_NAME={helvetica:'Arial',times:'Times New Roman',courier:'Courier New',georgia:'Georgia',verdana:'Verdana',calibri:'Calibri',garamond:'Garamond',cambria:'Cambria',trebuchet:'Trebuchet MS'};
const FONT_PDF_BASE={helvetica:'helvetica',times:'times',courier:'courier',georgia:'times',verdana:'helvetica',calibri:'helvetica',garamond:'times',cambria:'times',trebuchet:'helvetica'};
// Variáveis gerais de caraterização do processo, disponíveis para compor as linhas de
// cabeçalho e rodapé (caixas de seleção validadas — não é texto livre).
const PROCESS_VARS=[
 ['codigo','Código de processo'],
 ['numero','Nº processo (institucional)'],
 ['solicitanteInstitucional','Solicitante institucional'],
 ['designacaoInstitucional','Contexto'],
 ['designacaoTag','Designação TAG'],
 ['local','Local'],
 ['assunto','Resumo de situações a analisar'],
 ['tipoPeritagem','Tipo de peritagem (perito único / colegial)'],
 ['coordenador','Coordenador do processo'],
 ['gabineteUnico','Gabinete (só em peritagem de perito único)'],
 ['data','Data de hoje'],
 ['paginaTotal','Página / total de páginas']
];
function processVarLabel(key){const v=PROCESS_VARS.find(x=>x[0]===key);return v?v[1]:key}
function resolveProcessVar(proc,key,ctx){
 switch(key){
  case 'codigo':return proc.codigo||'';
  case 'numero':return proc.numero||'';
  case 'solicitanteInstitucional':return proc.solicitanteInstitucional||'';
  case 'designacaoInstitucional':return proc.designacaoInstitucional||'';
  case 'designacaoTag':return proc.designacaoTag||'';
  case 'local':return proc.local||'';
  case 'assunto':return proc.assunto||'';
  case 'tipoPeritagem':return peritosDoProcesso(proc).length>1?'Peritagem colegial':'Peritagem';
  case 'coordenador':{const iv=getInterveniente(proc.coordenadorId);return iv?iv.nome:''}
  // Só aparece em peritagem de perito único — em peritagem colegial não se atribui um
  // único gabinete, por isso fica em branco (regra pedida explicitamente).
  case 'gabineteUnico':{
   const peritos=peritosDoProcesso(proc);
   if(peritos.length!==1)return '';
   const g=app.gabinetes.find(x=>x.id===peritos[0].interveniente.gabineteId);
   if(!g)return '';
   return g.email?`${g.designacao} · ${g.email}`:g.designacao;
  }
  case 'data':return new Date().toLocaleDateString('pt-PT');
  case 'paginaTotal':return (ctx&&ctx.pagina!=null)?`${ctx.pagina}/${ctx.paginas}`:'';
  default:return '';
 }
}
function renderVarSlot(proc,keys,ctx){
 return (keys||[]).map(k=>resolveProcessVar(proc,k,ctx)).filter(Boolean).join(' · ');
}
// Cabeçalho por defeito: 3 linhas. O traço contínuo fica entre a 2ª e a 3ª linha (não
// entre a 1ª e a 2ª) — regra pedida explicitamente, para a 3ª linha ficar "solta" por
// baixo do traço, disponível para conteúdo livre configurável.
function defaultCabecalho(){
 return {
  linha1:{esquerda:['tipoPeritagem'],centro:[],direita:[]},
  linha2:{esquerda:['designacaoInstitucional'],centro:[],direita:[]},
  linha3:{esquerda:[],centro:[],direita:[]},
  tamanho:9,tamanho2:9,tamanho3:8,negrito:true,negrito2:false,negrito3:false
 };
}
// Rodapé por defeito: 2 linhas. A 1ª linha (esquerda) mostra o gabinete — só quando a
// peritagem é de perito único; em peritagem colegial fica em branco. A 2ª linha mantém o
// código do processo / data de geração / página-páginas. O traço contínuo fica acima de
// toda a zona de rodapé (antes da 1ª linha).
function defaultRodape(){
 return {
  linha1:{esquerda:['gabineteUnico'],centro:[],direita:[]},
  linha2:{esquerda:['codigo'],centro:['data'],direita:['paginaTotal']},
  tamanho:8,tamanho2:8
 };
}
function defaultState(){
 return {
  schema:2,
  pedidos:[],
  processos:[],
  intervenientes:[],
  funcoes:[{id:uid(),nome:'Perito'},{id:uid(),nome:'Mandatário'},{id:uid(),nome:'Topógrafo'}],
  siglasQuestao:[{id:uid(),sigla:'Qs',nome:'Questão'},{id:uid(),sigla:'Tm',nome:'Tema'}],
  tiposEvento:[{id:uid(),chave:'reuniao',nome:'Reunião'},{id:uid(),chave:'comunicacao',nome:'Comunicação',semPresencas:true},{id:uid(),chave:'informacao',nome:'Informação',semPresencas:true},{id:uid(),chave:'visita',nome:'Visita'}],
  representacoes:[{id:uid(),nome:'Parte A'},{id:uid(),nome:'Parte B'},{id:uid(),nome:'Nenhuma (coordenador)',isDefault:true}],
  resolucoesFoto:[{id:uid(),kb:150,nome:'150 KB'},{id:uid(),kb:300,nome:'300 KB',isDefault:true},{id:uid(),kb:500,nome:'500 KB'},{id:uid(),kb:800,nome:'800 KB'},{id:uid(),kb:'original',nome:'Original (sem compressão)'}],
  servicos:[{id:uid(),nome:'Peritagem'},{id:uid(),nome:'Inspeção'},{id:uid(),nome:'Parecer técnico'}],
  finalidades:[{id:uid(),nome:'Particular'},{id:uid(),nome:'Em contexto judicial'}],
  gabinetes:[
   {id:uid(),designacao:'Proficis Engenheiros * Peritos Avaliadores',email:'proficis.peritos@gmail.com',especificacoes:''},
   {id:uid(),designacao:'Perit_Ava * peritagens de engenharia e avaliação de ativos',email:'Peritava@gmail.com',especificacoes:''}
  ],
  tiposDocumento:[
   {id:uid(),nome:'Caderneta predial'},{id:uid(),nome:'Plantas'},{id:uid(),nome:'Relatório de peritagem'},
   {id:uid(),nome:'Lista de matéria a dar resposta'},{id:uid(),nome:'CRP'},{id:uid(),nome:'Lista de quesitos'}
  ],
  designacoesQuestao:[
   {id:uid(),nome:'Quesito',plural:'Quesitos',genero:'m',isDefault:true},
   {id:uid(),nome:'Questão',plural:'Questões',genero:'f'},
   {id:uid(),nome:'Tema',plural:'Temas',genero:'m'},
   {id:uid(),nome:'Situação',plural:'Situações',genero:'f'}
  ],
  // "Model docs": título de cada secção dos documentos gerados, com tipo de letra, tamanho
  // e negrito próprios — o título imprime-se uma só vez por secção, independentemente do
  // nº de páginas que essa secção ocupe.
  modelDocs:[
   {id:uid(),chave:'capa',titulo:'Capa de processo',fonte:'helvetica',tamanho:10,negrito:true},
   {id:uid(),chave:'resumoCronologia',titulo:'Resumo do processo',fonte:'helvetica',tamanho:10,negrito:true},
   {id:uid(),chave:'listaQuestoes',titulo:'A — Lista de questões colocadas',fonte:'helvetica',tamanho:10,negrito:true},
   {id:uid(),chave:'custosPendentes',titulo:'Resumo de questões com apuramento de custos pendente',fonte:'helvetica',tamanho:10,negrito:true},
   {id:uid(),chave:'listaAnalise',titulo:'B — Histórico de análise',fonte:'helvetica',tamanho:10,negrito:true},
   {id:uid(),chave:'listaDraft',titulo:'C — Draft de relatório (Respostas validadas)',fonte:'helvetica',tamanho:10,negrito:true},
   {id:uid(),chave:'listaDraftFinal',titulo:'C — Relatório final (Respostas validadas)',fonte:'helvetica',tamanho:10,negrito:true}
  ],
  settings:{
   release:'2.6',
   fotoGridCols:2,
   fotoResolutionKB:300,
   fotoOrientacaoDefault:'paisagem',
   documentoOrientacaoDefault:'retrato',
   capaGridSize:4,
   fieldOrder:defaultFieldOrder(),
   fieldLabels:{pedido:{},processo:{},questao:{}},
   customFields:{pedido:[],processo:[],questao:[]},
   layout:{pageSize:'a4',font:'helvetica',fontSize:10,marginLeft:2.0,marginTop:2.2,marginRight:1.5,marginBottom:1.5},
   cabecalho:defaultCabecalho(),
   rodape:defaultRodape()
  }
 };
}
let app=null;
function loadState(){
 try{const raw=localStorage.getItem(LS_KEY);app=raw?JSON.parse(raw):defaultState()}catch(e){console.error('Falha a ler estado local',e);app=defaultState()}
 const d=defaultState();
 if(!app.settings)app.settings=d.settings;
 if(!app.settings.fieldOrder)app.settings.fieldOrder=d.settings.fieldOrder;
 if(!app.settings.fieldLabels)app.settings.fieldLabels={pedido:{},processo:{},questao:{}};
 if(!app.settings.customFields)app.settings.customFields={pedido:[],processo:[],questao:[]};
 Object.keys(FIELD_DEFS).forEach(k=>{
  if(!app.settings.fieldOrder[k])app.settings.fieldOrder[k]=d.settings.fieldOrder[k];
  if(!app.settings.fieldLabels[k])app.settings.fieldLabels[k]={};
  if(!app.settings.customFields[k])app.settings.customFields[k]=[];
  // acrescenta no fim quaisquer campos novos que ainda não estejam na ordem gravada
  FIELD_DEFS[k].forEach(([key])=>{if(!app.settings.fieldOrder[k].includes(key))app.settings.fieldOrder[k].push(key)});
 });
 if(app.settings.fotoGridCols==null)app.settings.fotoGridCols=d.settings.fotoGridCols;
 if(!app.settings.fotoOrientacaoDefault)app.settings.fotoOrientacaoDefault=d.settings.fotoOrientacaoDefault;
 if(!app.settings.documentoOrientacaoDefault)app.settings.documentoOrientacaoDefault=d.settings.documentoOrientacaoDefault;
 if(!app.settings.capaGridSize)app.settings.capaGridSize=d.settings.capaGridSize;
 if(!app.funcoes||!app.funcoes.length)app.funcoes=d.funcoes;
 if(!app.siglasQuestao||!app.siglasQuestao.length)app.siglasQuestao=d.siglasQuestao;
 if(!app.tiposEvento||!app.tiposEvento.length)app.tiposEvento=d.tiposEvento;
 if(!app.representacoes||!app.representacoes.length)app.representacoes=d.representacoes;
 if(!app.resolucoesFoto||!app.resolucoesFoto.length)app.resolucoesFoto=d.resolucoesFoto;
 if(!app.servicos||!app.servicos.length)app.servicos=d.servicos;
 if(!app.finalidades||!app.finalidades.length)app.finalidades=d.finalidades;
 if(!app.gabinetes)app.gabinetes=d.gabinetes;
 if(!app.tiposDocumento||!app.tiposDocumento.length)app.tiposDocumento=d.tiposDocumento;
 if(!app.designacoesQuestao||!app.designacoesQuestao.length)app.designacoesQuestao=d.designacoesQuestao;
 if(!app.modelDocs||!app.modelDocs.length)app.modelDocs=d.modelDocs;

/* ===================== IndexedDB (fotos + ficheiros de documentação) ===================== */
let _dbP=null;
function idb(){
 if(_dbP)return _dbP;
 _dbP=new Promise((res,rej)=>{
  const rq=indexedDB.open(DB_NAME,2);
  rq.onupgradeneeded=()=>{
   const db=rq.result;
   if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);
   if(!db.objectStoreNames.contains(FILES_STORE))db.createObjectStore(FILES_STORE);
  };
  rq.onsuccess=()=>res(rq.result);
  rq.onerror=()=>rej(rq.error);
 });
 return _dbP;
}
async function idbPut(k,v,store){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction(store||STORE,'readwrite');tx.objectStore(store||STORE).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function idbGet(k,store){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction(store||STORE,'readonly');const r=tx.objectStore(store||STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDel(k,store){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction(store||STORE,'readwrite');tx.objectStore(store||STORE).delete(k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
const photoUrlCache={};
async function getPhotoUrl(id){
 if(photoUrlCache[id])return photoUrlCache[id];
 const blob=await idbGet(id);
 if(!blob)return '';
 const url=URL.createObjectURL(blob);
 photoUrlCache[id]=url;
 return url;
}
async function hydratePhotos(root){
 const imgs=(root||document).querySelectorAll('img[data-photo-id]:not([data-hydrated])');
 for(const img of imgs){
  img.setAttribute('data-hydrated','1');
  const url=await getPhotoUrl(img.getAttribute('data-photo-id'));
  if(url)img.src=url;
 }
}
// Documentos (Documentação do processo) — mesmo padrão dos getPhotoUrl/hydratePhotos, mas
// lendo da store de ficheiros (FILES_STORE) para gerar as miniaturas.
const docUrlCache={};
async function getDocUrl(id){
 if(docUrlCache[id])return docUrlCache[id];
 const blob=await idbGet(id,FILES_STORE);
 if(!blob)return '';
 const url=URL.createObjectURL(blob);
 docUrlCache[id]=url;
 return url;
}
async function hydrateDocs(root){
 const imgs=(root||document).querySelectorAll('img[data-doc-id]:not([data-hydrated])');
 for(const img of imgs){
  img.setAttribute('data-hydrated','1');
  const url=await getDocUrl(img.getAttribute('data-doc-id'));
  if(url)img.src=url;
 }
}

function getPedido(id){return app.pedidos.find(p=>p.id===id)}

function questoesDoAutor(proc,autorId){return (proc.questoes||[]).filter(q=>q.autorId===autorId).sort((a,b)=>a.numero-b.numero)}
function questoesOrdenadas(proc){

 let out=[];
 autores.forEach(a=>{questoesDoAutor(proc,a.id).forEach(q=>out.push({q,a}))});

// Código da questão: {autor}_{número sequencial a 3 dígitos}_({referência livre do autor})
function questaoCodigo(q,a){return `${a.ordem}_${pad(q.numero,3)}_(${q.referencia&&q.referencia.trim()?q.referencia.trim():''})`}
function questaoTitulo(q,a){return `${questaoCodigo(q,a)} - ${q.descricaoResumida||'(sem descrição)'}`}
// A entidade representada passou a viver no próprio interveniente (Configurações →
// Intervenientes) em vez de ser escolhida por processo — aqui deriva-se sempre dessa
// origem, para todos os usos existentes (PDF/Word, ecrã de Peritos) continuarem a funcionar.
function peritosDoProcesso(proc){
 return (proc.peritos||[]).map(p=>{
  const iv=getInterveniente(p.intervenienteId);
  if(!iv)return null;
  return {...p,interveniente:iv,representacaoId:iv.entidadeRepresentadaId||representacaoDefaultId()};
 }).filter(Boolean);
}
function fotosDaQuestao(proc,questaoId){return (proc.fotos||[]).filter(f=>f.questaoId===questaoId)}
function fotosCapa(proc){return (proc.fotos||[]).filter(f=>f.isCapa)}
// Número sequencial da foto dentro da sua questão — recalculado a partir da ordem
// atual de proc.fotos, pelo que eliminar ou reordenar fotos ajusta-o automaticamente.
function fotoSeq(proc,foto){
 if(!foto.questaoId)return null;
 return fotosDaQuestao(proc,foto.questaoId).findIndex(f=>f.id===foto.id)+1;
}
// Nomenclatura das fotos: {ordemAutor}_{numeroQuestao a 3 dígitos}_IMG_{sequência a 3 dígitos}
// (mesma lógica do código da questão — sem sigla, ex.: 1_001_IMG_005)
function photoFileName(proc,foto,ext){
 ext=ext||'jpg';
 const q=foto.questaoId?proc.questoes.find(x=>x.id===foto.questaoId):null;
 if(!q)return foto.id+'.'+ext;
 const a=proc.autores.find(x=>x.id===q.autorId);
 const seq=fotoSeq(proc,foto);
 return `${a?a.ordem:0}_${pad(q.numero,3)}_IMG_${pad(seq,3)}.${ext}`;
}
// Fotos de capa: as marcadas manualmente; se não chegarem para o tamanho da grelha
// por defeito, completa aleatoriamente com fotos das restantes questões.
function capaPhotosForExport(proc){
 const max=Number(app.settings.capaGridSize)||4;
 const marcadas=fotosCapa(proc);
 if(marcadas.length>=max)return marcadas.slice(0,max);
 const outras=(proc.fotos||[]).filter(f=>!f.isCapa);
 const baralhadas=outras.slice().sort(()=>Math.random()-0.5);
 return marcadas.concat(baralhadas.slice(0,max-marcadas.length));
}

function ensureExportConfig(proc){
 if(!proc.exportConfig)proc.exportConfig={capa:false,resumoCronologia:false,listaQuestoes:true,listaAnalise:true,listaDraft:true,custosPendentes:false,fotos:true,cols:app.settings.fotoGridCols||2,accepted:false};
 if(proc.exportConfig.listaQuestoes==null)proc.exportConfig.listaQuestoes=true;

function touch(proc){proc.updatedAt=new Date().toISOString()}
// Checklist de fecho: para além de todas as questões fechadas, exige confirmação explícita
// de que não há custos pendentes (automático, a partir da classificação das questões) e de
// que a documentação está completa (atestação manual do coordenador) — só depois passa a final.
function ensureChecklistFecho(proc){
 if(!proc.checklistFecho)proc.checklistFecho={documentacaoCompleta:false};
 return proc.checklistFecho;
}
function relatorioIsFinal(proc){
 const qs=proc.questoes||[];
 if(!qs.length||!qs.every(q=>q.fase==='relatorio'))return false;
 if(questoesComCustosPendentes(proc).length>0)return false;
 return !!ensureChecklistFecho(proc).documentacaoCompleta;
}
// Cronologia do processo: junta o log automático de alterações com os eventos registados
// (reuniões, visitas, informações, comunicações), ordenados cronologicamente — cada evento
// passa a integrar a cronologia, tal como pedido.
function cronologiaEntradas(proc){
 const log=(proc.log||[]).map(l=>({at:l.at,texto:l.msg}));
 const evs=(proc.eventos||[]).map(e=>{
  const tipo=app.tiposEvento.find(t=>t.id===e.tipoId);
  const at=(e.data||'')+'T'+(e.hora||'00:00');
  let texto=`${tipo?tipo.nome:'Evento'}${e.hora?' às '+e.hora:''} — ${e.descricaoResumida||'(sem descrição resumida)'}`;
  if(e.constrangimentos&&e.constrangimentos.trim())texto+=` · Constrangimentos: ${e.constrangimentos}`;
  return {at,texto};
 });
 return log.concat(evs).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
}

function pathGet(obj,path){return path.split('.').reduce((o,k)=>o==null?o:o[k],obj)}
function pathSet(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=val}
function resolveBindRoot(t){
 const scope=t.dataset.scope;
 if(scope==='processo')return getProcesso(t.dataset.scopeId||ui.params.processoId||ui.params.id);
 if(scope==='pedido')return getPedido(t.dataset.scopeId||ui.params.id);
 if(scope==='settings')return app.settings;
 if(scope==='interveniente')return getInterveniente(t.dataset.scopeId);
 if(scope==='modelDoc')return app.modelDocs.find(m=>m.id===t.dataset.scopeId);
 if(scope==='questao'){const proc=getProcesso(t.dataset.processoId||ui.params.processoId);return proc&&(proc.questoes||[]).find(x=>x.id===t.dataset.scopeId)}
 return app;
}
function bindField(t){
 const root=resolveBindRoot(t);
 if(!root)return;
 let val=t.type==='checkbox'?t.checked:t.value;
 if(t.type==='number')val=val===''?'':Number(val);
 pathSet(root,t.dataset.bind,val);
 if(t.dataset.scope==='processo'){const p=getProcesso(t.dataset.scopeId||ui.params.processoId||ui.params.id);if(p)touch(p)}
 if(t.dataset.scope==='questao'){const p=getProcesso(t.dataset.processoId||ui.params.processoId);if(p)touch(p)}
 save();
}

 const p={id:uid(),codigo:'PED-'+pad(app.pedidos.length+1,3),solicitante:'',contacto:'',email:'',dataPedido:todayISO(),servicoId:app.servicos[0]?app.servicos[0].id:'',finalidadeId:app.finalidades[0]?app.finalidades[0].id:'',assunto:'',local:'',prazo:'',status:'',motivo:'',createdAt:new Date().toISOString()};

document.addEventListener('change',e=>{
 const t=e.target;

 const p=getPedido(ui.params.id);if(!p)return;

   <button type="button" class="${p.status==='END'?'amber':'secondary'}" data-action="setPedidoStatus" data-id="${p.id}" data-status="END">END</button>
   <button type="button" class="${p.status==='OFF'?'danger':'secondary'}" data-action="setPedidoStatus" data-id="${p.id}" data-status="OFF">OFF</button>
  </div>

actions.setPedidoStatus=(b)=>{
 const p=getPedido(b.dataset.id);if(!p)return;
 p.status=b.dataset.status;
 if(p.status==='ON'){
  let proc=processoDoPedido(p.id);
  if(!proc){
   proc={id:uid(),pedidoId:p.id,codigo:p.codigo?p.codigo.replace(/^PED/,'PROC'):('PROC-'+pad(app.processos.length+1,3)),numero:'',solicitanteInstitucional:p.solicitante,designacaoInstitucional:'',designacaoTag:'',local:p.local,assunto:p.assunto,siglaId:app.siglasQuestao[0]?app.siglasQuestao[0].id:'',coordenadorId:'',status:'ON',motivo:'',documentacao:'',documentos:[],autores:[],questoes:[],peritos:[],eventos:[],fotos:[],log:[],createdAt:new Date().toISOString()};
   app.processos.push(proc);
   logEvento(proc,'Processo criado a partir do pedido '+p.codigo);
  }
 }
 saveNow();render();
};
actions.apagarPedido=(b)=>{
 if(!confirm('Eliminar este pedido? (o processo associado, se existir, mantém-se acessível em Processos)'))return;
 app.pedidos=app.pedidos.filter(p=>p.id!==b.dataset.id);
 saveNow();goHome();
};

/* ---- Processos ---- */
function viewProcessos(){
 const list=app.processos.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
 return card('📁 Processos', `
  <div>${list.length?list.map(pr=>{
   const nq=(pr.questoes||[]).length, nr=(pr.questoes||[]).filter(q=>q.fase==='relatorio').length;
   return `<div class="item" data-action="navTo" data-view="processo" data-params='${esc(JSON.stringify({id:pr.id}))}'>
    <b>${esc(pr.codigo)} ${statusPill(pr.status)}</b>
    <div class="meta">${esc(pr.solicitanteInstitucional||'')} · ${esc(pr.local||'')}</div>
    <div class="meta">${nq} questões · ${nr} em relatório provisório</div>
   </div>`}).join(''):'<div class="note">Ainda não há processos. Crie um pedido e coloque o estado em ON.</div>'}</div>

}

// Painel de controlo de pendentes: total de perguntas, por comentar (por perito) e já fechadas.
// Ordenado por autor (como questoesOrdenadas) para os agrupamentos por autor nos exports.
function questoesComCustosPendentes(proc){return questoesOrdenadas(proc).filter(x=>ensureClassificacao(x.q).verCustos).map(x=>x.q)}
function pendentesPainelHtml(proc){
 const todas=proc.questoes||[];
 const fechadas=todas.filter(q=>q.fase==='relatorio');
 const emAberto=todas.filter(q=>q.fase!=='relatorio');
 const custosPendentes=questoesComCustosPendentes(proc);
 const peritos=peritosDoProcesso(proc);
 const porPerito=peritos.map(p=>({
  perito:p,
  pendentes:emAberto.filter(q=>{
   const txt=q.respostas&&q.respostas[p.intervenienteId];
   return !(txt&&txt.trim());
  })
 }));
 return `
  <div class="row3">
   <div class="stat-tile"><b>${todas.length}</b><span>Total de perguntas</span></div>
   <div class="stat-tile"><b>${emAberto.length}</b><span>Por comentar/validar</span></div>
   <div class="stat-tile"><b>${fechadas.length}</b><span>Respostas fechadas</span></div>
  </div>
  ${custosPendentes.length?`
  <div class="pending-group">
   <h3>💰 ${custosPendentes.length} questão(ões) com apuramento de custos pendente</h3>
   ${custosPendentes.map(q=>{
    const a=proc.autores.find(x=>x.id===q.autorId);
    return `<div class="item" data-action="navTo" data-view="analiseQuestao" data-params='${esc(JSON.stringify({processoId:proc.id,id:q.id}))}'><b>${esc(questaoTitulo(q,a))}</b></div>`;
   }).join('')}
  </div>`:''}
  ${peritos.length?porPerito.map(({perito,pendentes})=>`
   <div class="pending-group">
    <h3>${esc(perito.interveniente.nome)} — ${pendentes.length} por comentar</h3>
    ${pendentes.length?pendentes.map(q=>{
     const a=proc.autores.find(x=>x.id===q.autorId);
     return `<div class="item" data-action="navTo" data-view="analiseQuestao" data-params='${esc(JSON.stringify({processoId:proc.id,id:q.id}))}'><b>${esc(questaoTitulo(q,a))}</b></div>${q.prazoResposta?`<div class="note">${prazoLabel(q.prazoResposta)}</div>`:''}`;
    }).join(''):'<div class="note">Sem pendências.</div>'}
   </div>
  `).join(''):'<div class="note">Associe peritos ao processo para ver as pendências por perito.</div>'}
 `;
}

 return `

 `)}
 ${card('📄 Documentação', `
  <div class="note">${(proc.documentos||[]).length} ficheiro(s) carregado(s).</div>
  <div class="actions one"><button type="button" data-action="navTo" data-view="documentos" data-params='${esc(JSON.stringify({processoId:proc.id}))}'>📄 Gerir documentação</button></div>

 ${card('⚖️ Peritos', `
  <div class="note">${peritos.length?peritos.map(p=>esc(p.interveniente.nome)+' ('+esc(representacaoNome(p.representacaoId))+')').join(', '):'Nenhum perito associado ainda.'}</div>
  <div class="actions one"><button type="button" data-action="navTo" data-view="peritos" data-params='${esc(JSON.stringify({processoId:proc.id}))}'>⚖️ Gerir peritos</button></div>
 `)}
 ${card('🗓️ Eventos', `

  <div class="actions one"><button type="button" data-action="navTo" data-view="eventos" data-params='${esc(JSON.stringify({processoId:proc.id}))}'>🗓️ Gerir eventos</button></div>

  <div class="actions one"><button type="button" data-action="navTo" data-view="questoes" data-params='${esc(JSON.stringify({processoId:proc.id}))}'>📑 Gerir autores e questões</button></div>
 `)}
 ${card('🔎 Análise', `
  <div class="note">Cada questão colocada é analisada por perito (proposta individual), depois conciliada pelo coordenador; aceite, fica fechada e segue para o relatório — a corrigir, volta à validação.</div>
  <div class="actions one"><button type="button" data-action="navTo" data-view="analise" data-params='${esc(JSON.stringify({processoId:proc.id}))}'>🔎 Abrir análise</button></div>
 `)}
 ${card('📋 Controlo de pendentes', pendentesPainelHtml(proc))}
 ${card(relatorioIsFinal(proc)?'✅ Relatório final':'📝 Relatório (draft)', `
  <div class="note">${questoes.filter(q=>q.fase==='relatorio').length} de ${questoes.length} questão(ões) já com resposta conciliada aceite.${relatorioIsFinal(proc)?' Todas as questões estão fechadas — versão final.':''}</div>
  <div class="actions one"><button type="button" data-action="navTo" data-view="relatorio" data-params='${esc(JSON.stringify({processoId:proc.id}))}'>📝 Ver / exportar relatório</button></div>

function siglaSelectHtml(proc){
 return `<select data-bind="siglaId" data-scope="processo" data-scope-id="${proc.id}">${app.siglasQuestao.map(s=>`<option value="${s.id}" ${proc.siglaId===s.id?'selected':''}>${esc(s.sigla)} — ${esc(s.nome)}</option>`).join('')}</select>`;
}
actions.setProcessoStatus=(b)=>{
 const proc=getProcesso(b.dataset.id);if(!proc)return;

/* ---- Autores & Questões ---- */
function viewAutores(params){
 const proc=getProcesso(params.processoId);if(!proc)return '';
 const autores=autoresDoProcesso(proc);
 return card('🧑‍🤝‍🧑 Autores', `
  <div>${autores.length?autores.map(a=>`
   <div class="item">
    <b>${a.ordem} — ${esc(a.nome)}</b>
    <div class="meta">${questoesDoAutor(proc,a.id).length} questão(ões)</div>
    <div class="item-actions">
     <button type="button" class="secondary" data-action="editarAutor" data-processo="${proc.id}" data-id="${a.id}">✏️ Editar</button>
     <button type="button" class="danger" data-action="apagarAutor" data-processo="${proc.id}" data-id="${a.id}">🗑 Eliminar</button>
    </div>
   </div>`).join(''):'<div class="note">Ainda não há autores.</div>'}</div>
  <div class="actions one"><button type="button" data-action="novoAutor" data-processo="${proc.id}">➕ Novo autor</button></div>
 `);
}
actions.novoAutor=(b)=>{
 const proc=getProcesso(b.dataset.processo);
 const nome=prompt('Nome / referência do autor das questões:');
 if(!nome)return;
 const ordem=(proc.autores||[]).reduce((m,a)=>Math.max(m,a.ordem),0)+1;
 if(!proc.autores)proc.autores=[];
 proc.autores.push({id:uid(),nome,ordem});
 touch(proc);logEvento(proc,'Autor "'+nome+'" criado');saveNow();render();
};
actions.editarAutor=(b)=>{
 const proc=getProcesso(b.dataset.processo);
 const a=proc.autores.find(x=>x.id===b.dataset.id);if(!a)return;
 const nome=prompt('Nome do autor:',a.nome);if(nome==null)return;
 const ordem=prompt('Ordem do autor (número):',a.ordem);if(ordem==null)return;
 a.nome=nome;a.ordem=Number(ordem)||a.ordem;
 touch(proc);saveNow();render();
};
actions.apagarAutor=(b)=>{
 const proc=getProcesso(b.dataset.processo);
 if(!confirm('Eliminar este autor? As suas questões também serão eliminadas.'))return;
 const qIds=questoesDoAutor(proc,b.dataset.id).map(q=>q.id);
 proc.questoes=(proc.questoes||[]).filter(q=>!qIds.includes(q.id));
 proc.fotos=(proc.fotos||[]).filter(f=>!qIds.includes(f.questaoId));
 proc.autores=proc.autores.filter(a=>a.id!==b.dataset.id);
 touch(proc);saveNow();render();
};

function viewQuestoes(params){
 const proc=getProcesso(params.processoId);if(!proc)return '';
 const autores=autoresDoProcesso(proc);
 return `
 ${card('🏷️ Autores & Questões', `
  <div class="actions">
   <button type="button" data-action="navTo" data-view="autores" data-params='${esc(JSON.stringify({processoId:proc.id}))}'>🧑‍🤝‍🧑 Gerir autores</button>
   <button type="button" class="secondary" data-action="navTo" data-view="importQuestoes" data-params='${esc(JSON.stringify({processoId:proc.id}))}'>📥 Importar questões</button>
  </div>
 `)}
 ${autores.length?autores.map(a=>{
  const qs=questoesDoAutor(proc,a.id);
  return card(`${a.ordem} — ${esc(a.nome)}`, `
   <div>${qs.length?qs.map(q=>`
    <div class="item" data-action="navTo" data-view="questaoForm" data-params='${esc(JSON.stringify({processoId:proc.id,id:q.id}))}'>
     <b>${esc(questaoTitulo(q,a))}</b>
     <div class="meta">${fasePill(q.fase||'analise')} ${fotoStatusPill(fotosDaQuestao(proc,q.id).length)}</div>
    </div>`).join(''):'<div class="note">Sem questões neste autor.</div>'}</div>
   <div class="actions one"><button type="button" data-action="novaQuestao" data-processo="${proc.id}" data-autor="${a.id}">➕ Nova questão</button></div>
  `);
 }).join(''):card('Questões','<div class="note">Crie primeiro um autor.</div>')}
 `;
}
actions.novaQuestao=(b)=>{
 const proc=getProcesso(b.dataset.processo),autorId=b.dataset.autor;
 const numero=questoesDoAutor(proc,autorId).reduce((m,q)=>Math.max(m,q.numero),0)+1;
 const q={id:uid(),autorId,numero,siglaId:proc.siglaId||(app.siglasQuestao[0]&&app.siglasQuestao[0].id),referencia:'',descricaoResumida:'',descricaoCompleta:'',fase:'analise',respostas:{},historico:[],conciliada:{texto:'',aceite:false},createdAt:new Date().toISOString()};

function addQuestoesFromLines(proc,autorId,lines){
 let n=questoesDoAutor(proc,autorId).reduce((m,q)=>Math.max(m,q.numero),0);
 let count=0;
 lines.map(l=>l.trim()).filter(Boolean).forEach(txt=>{
  n++;count++;
  proc.questoes.push({id:uid(),autorId,numero:n,siglaId:proc.siglaId,referencia:'',descricaoResumida:txt.slice(0,140),descricaoCompleta:txt,fase:'analise',respostas:{},historico:[],conciliada:{texto:'',aceite:false},createdAt:new Date().toISOString()});
 });
 touch(proc);logEvento(proc,count+' questão(ões) importada(s)');
 return count;
}

 const proc=getProcesso(b.dataset.processo);
 const autorId=$('importAutor').value;
 const lines=$('importText').value.split('\n');
 const n=addQuestoesFromLines(proc,autorId,lines);
 saveNow();
 $('importText').value='';
 $('importState').textContent=n+' questão(ões) importada(s) com sucesso.';
 render();
};
actions.importarFicheiro=async(b)=>{
 const proc=getProcesso(b.dataset.processo);
 const autorId=$('importAutor').value;
 const file=$('importFile').files[0];
 if(!file){alert('Escolha um ficheiro.');return}
 const st=$('importState');st.textContent='A processar...';
 try{
  let lines=[];
  const name=file.name.toLowerCase();
  if(name.endsWith('.txt')||name.endsWith('.csv')){
   const txt=await file.text();
   lines=txt.split('\n').map(l=>l.split(',')[0]);
  }else if(name.endsWith('.docx')){
   const zip=await JSZip.loadAsync(file);
   const xml=await zip.file('word/document.xml').async('text');
   lines=xml.split('</w:p>').map(p=>p.replace(/<[^>]+>/g,'')).map(s=>s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim());
  }else if(name.endsWith('.xlsx')){
   const zip=await JSZip.loadAsync(file);
   let shared=[];
   const sharedFile=zip.file('xl/sharedStrings.xml');
   if(sharedFile){
    const sxml=await sharedFile.async('text');
    shared=(sxml.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[]).map(t=>t.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'));
   }
   const sheetFile=zip.file('xl/worksheets/sheet1.xml');
   const sxml=sheetFile?await sheetFile.async('text'):'';
   const rows=sxml.split('</row>');
   rows.forEach(row=>{
    const m=row.match(/<c[^>]*r="A\d+"[^>]*>([\s\S]*?)<\/c>/);
    if(!m)return;
    const isShared=/t="s"/.test(m[0]);
    const vMatch=m[1].match(/<v>([\s\S]*?)<\/v>/);
    if(!vMatch)return;
    const val=isShared?shared[Number(vMatch[1])]:vMatch[1];
    if(val)lines.push(val);
   });
  }else{
   alert('Formato não suportado.');st.textContent='';return;
  }
  const n=addQuestoesFromLines(proc,autorId,lines);
  saveNow();
  st.textContent=n+' questão(ões) importada(s) de '+file.name+'.';
  render();
 }catch(err){
  console.error(err);
  st.textContent='Erro ao importar: '+(err.message||err);
 }
};

/* ---- Análise ---- */
// Veredito da questão — estado de confirmação da situação analisada.
const VEREDITO_OPTIONS=[['confirma','Confirma-se'],['confirma_parcial','Confirma-se parcialmente'],['nao_confirma','Não se confirma'],['nao_identificada','Sit. não identificada']];
function veredictoLabel(v){const o=VEREDITO_OPTIONS.find(x=>x[0]===v);return o?o[1]:''}
function veredictoPill(v){return v?`<span class="pill sby">${esc(veredictoLabel(v))}</span>`:''}
function ensureClassificacao(q){
 if(!q.classificacao)q.classificacao={consequencias:false,operacoesReparacao:false,verCustos:false};
 return q.classificacao;
}
// Prazo de resposta (SLA) por questão — opcional. Devolve dias em atraso (>0), dias que
// faltam (<0) ou null se não houver prazo definido.
function diasAtePrazo(prazoISO){
 if(!prazoISO)return null;
 const hoje=new Date(todayISO()+'T00:00:00'),prazo=new Date(prazoISO+'T00:00:00');
 return Math.round((hoje-prazo)/86400000);
}
// Trilha de auditoria da resposta conciliada: regista um snapshot (texto+aceite, com
// timestamp) sempre que há uma alteração real — ao sair do campo de texto ou ao
// aceitar/reabrir — para se poder ver depois o que mudou entre versões e quando.
function snapshotConciliada(q,aceiteOverride){
 if(!q.conciliadaHistorico)q.conciliadaHistorico=[];
 const aceite=aceiteOverride!=null?aceiteOverride:q.conciliada.aceite;
 const last=q.conciliadaHistorico[q.conciliadaHistorico.length-1];
 if(last&&last.texto===q.conciliada.texto&&last.aceite===aceite)return;
 q.conciliadaHistorico.push({at:new Date().toISOString(),texto:q.conciliada.texto,aceite});
}
function prazoLabel(prazoISO){
 const dias=diasAtePrazo(prazoISO);
 if(dias==null)return '';
 if(dias>0)return `⚠ ${dias} dia(s) em atraso (prazo ${esc(prazoISO)})`;
 if(dias===0)return `⏰ vence hoje (${esc(prazoISO)})`;
 return `Prazo: ${esc(prazoISO)} (${-dias} dia(s))`;
}

function fileSizeLabel(bytes){
 if(bytes==null)return '';
 if(bytes<1024)return bytes+' B';

 return (bytes/1024/1024).toFixed(1)+' MB';
}
function docIcon(nome){
 const ext=(nome||'').split('.').pop().toLowerCase();

 if(['xls','xlsx','csv'].includes(ext))return '📊';
 if(['ppt','pptx'].includes(ext))return '📽️';
 if(['zip','rar','7z'].includes(ext))return '🗜️';
 return '📄';
}

// Ao carregar um documento de imagem, verifica a orientação predominante configurada para
// documentos (Configurações → Documentação) — a mesma rotina de rodar/eliminar/manter das
// fotografias. Ficheiros que não sejam imagem (PDF, Word, ...) não são verificados.
async function processarNovoDocumento(proc,file){
 const id=uid();
 let width=null,height=null,orientacao=null,flagRotacao=false;
 if(file.type&&file.type.startsWith('image/')){
  try{
   const img=await decodeImageOriented(file);
   width=img.width;height=img.height;
   if(img.close)img.close();
   orientacao=height>=width?'portrait':'landscape';
   const dominante=app.settings.documentoOrientacaoDefault==='paisagem'?'landscape':'portrait';
   flagRotacao=orientacao!==dominante;
  }catch(e){/* não decodificável como imagem — segue sem verificação de orientação */}
 }
 await idbPut(id,file,FILES_STORE);

 if(naoConformes.length)await reviewOrientation(proc,naoConformes,0);
});
// Descodifica respeitando a orientação EXIF (fotos de câmara, sobretudo iPhone, trazem
// muitas vezes um pixel "deitado" + uma flag EXIF a dizer para rodar ao mostrar; um
// <img>/<canvas> nem sempre respeita essa flag de forma consistente entre browsers —
// createImageBitmap com imageOrientation:'from-image' resolve isso de forma uniforme,
// para a rotação ficar correta desde a compressão e propagar-se a todos os documentos gerados.
async function decodeImageOriented(fileOrBlob){
 if(window.createImageBitmap){
  try{return await createImageBitmap(fileOrBlob,{imageOrientation:'from-image'})}
  catch(e){/* sem suporte à opção — cai para o método alternativo */}
 }
 return await fileToImage(fileOrBlob);
}
async function compressImage(file,targetKB){
 const img=await decodeImageOriented(file);
 let w=img.width,h=img.height;
 const maxSide=2000;
 if(Math.max(w,h)>maxSide){const s=maxSide/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
 const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
 if(img.close)img.close();
 let q=0.85,blob=await canvasToBlob(canvas,q);
 if(targetKB!=='original'){
  const targetBytes=Number(targetKB)*1024;
  let tries=0;
  while(blob.size>targetBytes&&q>0.35&&tries<8){q-=0.1;blob=await canvasToBlob(canvas,q);tries++}
 }
 return {blob,width:w,height:h};
}
function fileToImage(file){
 return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{res(img)};
  img.onerror=rej;
  img.src=url;
 });
}
function canvasToBlob(canvas,q){return new Promise(res=>canvas.toBlob(res,'image/jpeg',q))}
async function processarNovaFoto(proc,questaoId,file){
 const {blob,width,height}=await compressImage(file,app.settings.fotoResolutionKB);
 const id=uid();
 await idbPut(id,blob);
 const orientacao=height>=width?'portrait':'landscape';
 // A orientação por defeito configurada em Configurações → Fotografias é sempre a referência
 // (não a maioria das fotos já carregadas) — é contra ela que cada foto nova é controlada.
 const dominante=app.settings.fotoOrientacaoDefault==='paisagem'?'landscape':'portrait';
 const flag=orientacao!==dominante;
 if(!proc.fotos)proc.fotos=[];
 proc.fotos.push({id,questaoId,caption:'',isCapa:false,width,height,orientacao,captionFlagRotacao:flag,createdAt:new Date().toISOString()});
 touch(proc);logEvento(proc,'Foto adicionada'+(questaoId?' à questão':''));
 return id;
}

/* ---- Pendentes de resposta — filtro global por processo/perito (para insistir no feedback) ---- */
function viewPendentesGlobal(params){
 params=params||{};
 const todosPeritos=[];
 app.processos.forEach(proc=>peritosDoProcesso(proc).forEach(p=>{
  if(!todosPeritos.some(x=>x.id===p.intervenienteId))todosPeritos.push({id:p.intervenienteId,nome:p.interveniente.nome});
 }));
 todosPeritos.sort((x,y)=>x.nome.localeCompare(y.nome));
 const procFiltro=params.processoId||'';
 const peritoFiltro=params.intervenienteId||'';
 const processos=app.processos.filter(pr=>!procFiltro||pr.id===procFiltro);
 const linhas=[];
 processos.forEach(proc=>{
  const emAberto=(proc.questoes||[]).filter(q=>q.fase!=='relatorio');
  peritosDoProcesso(proc).forEach(p=>{
   if(peritoFiltro&&p.intervenienteId!==peritoFiltro)return;
   const pendentes=emAberto.filter(q=>{const txt=q.respostas&&q.respostas[p.intervenienteId];return !(txt&&txt.trim())});
   if(!pendentes.length)return;
   const lastNotif=proc.notificacoesPendentes&&proc.notificacoesPendentes[p.intervenienteId];
   linhas.push({proc,perito:p,pendentes,lastNotif});
  });
 });
 return card('📌 Pendentes de resposta', `
  <div class="note">Filtre por processo e/ou por perito para ver o que está por responder e poder insistir no respetivo feedback.</div>
  <div class="row">
   <div>${field('Processo',`<select data-action-input="filtroPendProcesso"><option value="">— todos —</option>${app.processos.map(pr=>`<option value="${pr.id}" ${procFiltro===pr.id?'selected':''}>${esc(pr.codigo)}</option>`).join('')}</select>`)}</div>
   <div>${field('Perito',`<select data-action-input="filtroPendPerito"><option value="">— todos —</option>${todosPeritos.map(p=>`<option value="${p.id}" ${peritoFiltro===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select>`)}</div>
  </div>
  ${linhas.length?linhas.slice().sort((x,y)=>{
    const dx=Math.max(-Infinity,...x.pendentes.map(q=>diasAtePrazo(q.prazoResposta)??-Infinity));
    const dy=Math.max(-Infinity,...y.pendentes.map(q=>diasAtePrazo(q.prazoResposta)??-Infinity));
    return dy-dx;
   }).map(({proc,perito,pendentes,lastNotif})=>`
   <div class="pending-group">
    <h3>${esc(proc.codigo)} · ${esc(perito.interveniente.nome)} — ${pendentes.length} por comentar</h3>
    ${lastNotif?`<div class="note">Última notificação: ${esc(new Date(lastNotif).toLocaleString('pt-PT'))}</div>`:''}
    ${pendentes.map(q=>{
     const a=proc.autores.find(x=>x.id===q.autorId);
     return `<div class="item" data-action="navTo" data-view="analiseQuestao" data-params='${esc(JSON.stringify({processoId:proc.id,id:q.id}))}'><b>${esc(questaoTitulo(q,a))}</b></div>${q.prazoResposta?`<div class="note">${prazoLabel(q.prazoResposta)}</div>`:''}`;
    }).join('')}
    <div class="actions one"><button type="button" class="amber" data-action="notificarPerito" data-processo="${proc.id}" data-interveniente="${perito.intervenienteId}">🔔 Marcar como notificado</button></div>
   </div>
  `).join(''):'<div class="note">Sem pendências para os filtros escolhidos.</div>'}
  ${returnLinkBtn()}
 `);
}
document.addEventListener('change',e=>{
 const t=e.target;
 if(ui.view!=='pendentesGlobal')return;
 if(t.dataset.actionInput==='filtroPendProcesso')navReplace('pendentesGlobal',{...ui.params,processoId:t.value});
 if(t.dataset.actionInput==='filtroPendPerito')navReplace('pendentesGlobal',{...ui.params,intervenienteId:t.value});
});
actions.notificarPerito=(b)=>{
 const proc=getProcesso(b.dataset.processo);if(!proc)return;
 if(!proc.notificacoesPendentes)proc.notificacoesPendentes={};
 proc.notificacoesPendentes[b.dataset.interveniente]=new Date().toISOString();
 const iv=getInterveniente(b.dataset.interveniente);
 touch(proc);logEvento(proc,'Perito '+(iv?iv.nome:'—')+' notificado para responder às pendências');
 saveNow();render();
};

actions.moveFieldOrder=(b)=>{
 const kind=b.dataset.kind,key=b.dataset.key,dir=b.dataset.dir;
 const arr=app.settings.fieldOrder[kind];
 const i=arr.indexOf(key);if(i<0)return;
 const j=dir==='up'?i-1:i+1;
 if(j<0||j>=arr.length)return;
 [arr[i],arr[j]]=[arr[j],arr[i]];
 saveNow();render();
};
actions.renameFieldOrder=(b)=>{
 const kind=b.dataset.kind,key=b.dataset.key;
 const atual=resolveFieldLabel(kind,key);
 const novo=prompt('Novo nome do campo:',atual);
 if(!novo||!novo.trim())return;
 app.settings.fieldLabels[kind][key]=novo.trim();
 saveNow();render();
};
actions.duplicateFieldOrder=(b)=>{
 const kind=b.dataset.kind,key=b.dataset.key;
 const label=resolveFieldLabel(kind,key);
 const newKey='custom_'+uid();
 app.settings.customFields[kind].push({key:newKey,label:label+' (cópia)'});
 const arr=app.settings.fieldOrder[kind];
 const i=arr.indexOf(key);
 arr.splice(i>=0?i+1:arr.length,0,newKey);
 saveNow();render();
};
actions.deleteFieldOrder=(b)=>{
 const kind=b.dataset.kind,key=b.dataset.key;
 const isCustom=(app.settings.customFields[kind]||[]).some(c=>c.key===key);
 if(!isCustom)return alert('Este é um campo base da aplicação e não pode ser eliminado — pode duplicá-lo para criar uma variante personalizada.');
 if(!confirm('Eliminar este campo personalizado? Os valores já preenchidos deixam de ser mostrados (não são apagados dos registos).'))return;
 app.settings.customFields[kind]=app.settings.customFields[kind].filter(c=>c.key!==key);
 app.settings.fieldOrder[kind]=app.settings.fieldOrder[kind].filter(k=>k!==key);
 delete app.settings.fieldLabels[kind][key];
 saveNow();render();
};
actions.resetFieldOrder=()=>{
 if(!confirm('Repor a ordem por defeito dos campos base em todos os formulários? Os campos personalizados mantêm-se, acrescentados no fim.'))return;
 const customKeysByKind={};
 Object.keys(FIELD_DEFS).forEach(k=>{customKeysByKind[k]=(app.settings.customFields[k]||[]).map(c=>c.key)});
 app.settings.fieldOrder=defaultFieldOrder();
 Object.keys(FIELD_DEFS).forEach(k=>{app.settings.fieldOrder[k]=app.settings.fieldOrder[k].concat(customKeysByKind[k])});
 saveNow();render();
};

actions.backupOut=async(b)=>{

 try{
  const zip=new JSZip();
  zip.file('dados.json',JSON.stringify(app,null,2));
  const fotos=zip.folder('fotos');
  const allProcFotos=app.processos.flatMap(p=>p.fotos||[]);
  for(const f of allProcFotos){
   const blob=await idbGet(f.id);
   if(blob)fotos.file(f.id+'.jpg',blob);
  }
  const docsZip=zip.folder('documentos');
  const allProcDocs=app.processos.flatMap(p=>p.documentos||[]);
  for(const d of allProcDocs){
   const blob=await idbGet(d.id,FILES_STORE);
   if(blob)docsZip.file(d.id+'__'+d.nome,blob);
  }
  const blob=await zip.generateAsync({type:'blob'});
  await shareOrDownload(blob,'PeriGest_backup_'+todayISO()+'.zip');
  st.textContent='Backup_OUT concluído: '+allProcFotos.length+' foto(s) e '+allProcDocs.length+' documento(s) incluído(s).';
 }catch(err){console.error(err);st.textContent='Erro no Backup_OUT: '+(err.message||err)}
};
actions.backupInTrigger=()=>$('backupInFile').click();
document.addEventListener('change',async e=>{
 if(e.target.id!=='backupInFile')return;
 const file=e.target.files[0];if(!file)return;
 if(!confirm('Restaurar esta cópia substitui os dados atuais. Continuar?'))return;
 const st=$('backupState');st.textContent='A restaurar...';
 try{
  const zip=await JSZip.loadAsync(file);
  const json=await zip.file('dados.json').async('text');
  const restored=JSON.parse(json);
  const fotosFolder=zip.folder('fotos');
  const files=fotosFolder?Object.keys(fotosFolder.files).filter(n=>!fotosFolder.files[n].dir):[];
  for(const name of files){
   const entry=zip.file(name);
   if(!entry)continue;
   const id=name.split('/').pop().replace('.jpg','');
   const blob=await entry.async('blob');
   await idbPut(id,blob);
  }
  const docsFolder=zip.folder('documentos');
  const docNames=docsFolder?Object.keys(docsFolder.files).filter(n=>!docsFolder.files[n].dir):[];
  for(const name of docNames){
   const entry=zip.file(name);
   if(!entry)continue;
   const id=name.split('/').pop().split('__')[0];
   const blob=await entry.async('blob');
   await idbPut(id,blob,FILES_STORE);
  }
  app=restored;saveNow();
  Object.keys(photoUrlCache).forEach(k=>{URL.revokeObjectURL(photoUrlCache[k]);delete photoUrlCache[k]});
  st.textContent='Backup_IN concluído: '+files.length+' foto(s) e '+docNames.length+' documento(s) restaurado(s).';
  goHome();
 }catch(err){console.error(err);st.textContent='Erro no Backup_IN: '+(err.message||err)}
 e.target.value='';
});
actions.apagarTudo=async()=>{
 if(!confirm('Eliminar TODOS os dados locais (pedidos, processos, fotos, documentos)? Esta ação não pode ser revertida sem um Backup_OUT prévio.'))return;
 app=defaultState();saveNow();
 const d=await idb();
 await new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
 await new Promise((res,rej)=>{const tx=d.transaction(FILES_STORE,'readwrite');tx.objectStore(FILES_STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
 Object.keys(photoUrlCache).forEach(k=>{URL.revokeObjectURL(photoUrlCache[k]);delete photoUrlCache[k]});
 goHome();
};

/* ---- Auxiliares de imagem (fotos → dataURL para jsPDF / docx) ---- */
function blobToDataUrl(blob){
 return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});
}
function imageDimsFromDataUrl(dataUrl){
 return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res({w:img.naturalWidth,h:img.naturalHeight});img.onerror=rej;img.src=dataUrl});
}
async function loadPhotoForDoc(fotoId){
 const blob=await idbGet(fotoId);
 if(!blob)return null;
 return await blobToDataUrl(blob);
}

/* ---- PDF: Capa (opc.) / Resumo+Cronologia (opc.) / A-Lista de questões / B-Histórico de análise / C-Draft de relatório (defeito) ---- */
async function buildResumoPdf(proc,cfg){
 if(!(window.jspdf&&window.jspdf.jsPDF))throw new Error('O gerador de PDF ainda não carregou. Verifique a ligação à internet.');
 cfg=cfg||ensureExportConfig(proc);
 const {jsPDF}=window.jspdf;
 const s=app.settings,L=s.layout;
 const doc=new jsPDF({unit:'mm',format:L.pageSize||'a4'});
 const F=FONT_PDF_BASE[L.font]||'helvetica',BS=Number(L.fontSize)||10;
 const mL=(Number(L.marginLeft)||2)*10,mT=(Number(L.marginTop)||2)*10,mR=(Number(L.marginRight)||1.5)*10,mB=(Number(L.marginBottom)||1.5)*10;
 const pageW=doc.internal.pageSize.getWidth(),pageH=doc.internal.pageSize.getHeight(),contentW=pageW-mL-mR;
 const cols=Math.max(1,Math.min(5,Number(cfg.cols)||app.settings.fotoGridCols||2));
 const desig=getDesignacaoQuestao(proc);
 let y=mT,currentTitulo='';
 // Cabeçalho e rodapé são desenhados numa passagem final (após gerar todo o conteúdo),
 // para que a variável "Página / total de páginas" tenha o total já conhecido em qualquer posição.
 const newPage=()=>{doc.addPage();y=mT+6};
 const ensure=(needed)=>{if(y+needed>pageH-mB)newPage()};
 const setTitulo=(t)=>{currentTitulo=t};
 y=mT+6;

 // parágrafo: justificado, salvo quando cabe numa só linha (alinhado à esquerda nesse caso)
 const writeParagraph=(text,fontSize,x,w)=>{
  doc.setFont(F,'normal');doc.setFontSize(fontSize);
  const lines=doc.splitTextToSize(String(text||''),w);
  const lineH=fontSize*0.45+1.1;
  lines.forEach((line,i)=>{
   ensure(lineH);
   const isLast=i===lines.length-1;
   if(!isLast&&lines.length>1)doc.text(line,x,y,{align:'justify',maxWidth:w});
   else doc.text(line,x,y);
   y+=lineH;
  });
 };
 const sectionTitle=(t)=>{ensure(12);doc.setFont(F,'bold');doc.setFontSize(BS+8);doc.text(t,mL,y);y+=10};
 // Título de secção configurável (model docs) — imprime-se uma só vez, à entrada da secção,
 // independentemente do nº de páginas que essa secção venha a ocupar.
 const sectionTitleModel=(chave)=>{
  const m=getModelDoc(chave);
  const mf=FONT_PDF_BASE[m.fonte]||F,ms=Number(m.tamanho)||10;
  ensure(ms*0.5+4);doc.setFont(mf,m.negrito?'bold':'normal');doc.setFontSize(ms);
  doc.text(m.titulo,mL,y);y+=ms*0.45+6;
  doc.setFont(F,'normal');doc.setFontSize(BS);
 };
 // Cabeçalho de grupo por autor — uma linha em branco antes e depois, uma só vez no início
 // do bloco contíguo de cada autor (não repetido por questão).
 const autorGroupHeaderPdf=(autorNome)=>{
  y+=4;
  ensure(10);doc.setFont(F,'bold');doc.setFontSize(BS+1);
  doc.text(autorGroupHeaderText(desig,autorNome),mL,y);y+=8;
  doc.setFont(F,'normal');doc.setFontSize(BS);
 };
 const label=(t)=>{ensure(6);doc.setFont(F,'bold');doc.setFontSize(BS);doc.text(t,mL,y);y+=6};
 const plain=(t,sz)=>{doc.setFont(F,'normal');doc.setFontSize(sz||BS);const w=doc.splitTextToSize(t,contentW);ensure(w.length*(sz||BS)*0.45+2);doc.text(w,mL,y);y+=w.length*(sz||BS)*0.45+2};
 const kv=(k,v)=>plain(`${k}: ${v||'—'}`);

 const drawPhotoGrid=async(fotos,noCaption)=>{
  if(!fotos.length)return;
  const gap=4,cellW=(contentW-gap*(cols-1))/cols,cellH=cellW*0.8,capH=8;
  for(let i=0;i<fotos.length;i+=cols){
   const row=fotos.slice(i,i+cols);
   ensure(cellH+capH+4);
   for(let c=0;c<row.length;c++){
    const f=row[c],cx=mL+c*(cellW+gap);
    try{
     const dataUrl=await loadPhotoForDoc(f.id);
     if(dataUrl){
      const dim=await imageDimsFromDataUrl(dataUrl);
      let dw=cellW,dh=cellW*(dim.h/dim.w);

async function buildResumoDocx(proc,cfg){

 const cm2tw=v=>Math.round((Number(v)||0)*566.9);
 const mL=cm2tw(s.layout.marginLeft),mT=cm2tw(s.layout.marginTop),mR=cm2tw(s.layout.marginRight),mB=cm2tw(s.layout.marginBottom);
 const pgW=11906,pgH=16838;

 // medição de quebra de linha (reaproveita jsPDF só para decidir justificar vs alinhar à esquerda)

 if(window.jspdf&&window.jspdf.jsPDF){

 }

 const run=(text,o)=>{o=o||{};let rpr='<w:rPr>';if(o.font)rpr+='<w:rFonts w:ascii="'+o.font+'" w:hAnsi="'+o.font+'"/>';if(o.bold)rpr+='<w:b/>';if(o.italic)rpr+='<w:i/>';if(o.color)rpr+='<w:color w:val="'+o.color+'"/>';rpr+='<w:sz w:val="'+(o.size||szBody)+'"/></w:rPr>';return '<w:r>'+rpr+'<w:t xml:space="preserve">'+esc(text)+'</w:t></w:r>'};
 const para=(inner,o)=>{o=o||{};let ppr='<w:pPr>';if(o.align)ppr+='<w:jc w:val="'+o.align+'"/>';if(o.indent)ppr+='<w:ind w:left="'+o.indent+'"/>';ppr+='<w:spacing w:after="'+(o.after!=null?o.after:120)+'"/></w:pPr>';return '<w:p>'+ppr+inner+'</w:p>'};
 const paraAuto=(text,o)=>{o=o||{};const align=willWrap(text)?'both':'left';return para(run(text,{font:F,size:szBody}),{align,indent:o.indent,after:o.after!=null?o.after:140})};
 const parts=[];

 // Cabeçalho de grupo por autor — uma linha em branco antes e depois, uma só vez no início

 // Campo dinâmico do Word (PAGE / NUMPAGES) — usado quando a variável "Página / total de páginas" é escolhida.
 const docxFieldRun=(code,size,bold)=>{
  let rpr='<w:rPr>';if(F)rpr+='<w:rFonts w:ascii="'+F+'" w:hAnsi="'+F+'"/>';if(bold)rpr+='<w:b/>';rpr+='<w:sz w:val="'+size+'"/><w:szCs w:val="'+size+'"/></w:rPr>';
  return '<w:r>'+rpr+'<w:fldChar w:fldCharType="begin"/></w:r>'
   +'<w:r>'+rpr+'<w:instrText xml:space="preserve"> '+code+' </w:instrText></w:r>'

  const out=[];

 // Parágrafo com 3 posições (esquerda/tab-centro/tab-direita), usado no cabeçalho e rodapé.

 let mediaIdx=0,relIdx=1,drawingId=0;

// O download programático via <a download> em URLs blob não é fiável no Safari iOS/iPadOS
// (é frequentemente ignorado). Prioriza-se por isso a Web Share API (folha de partilha
// nativa, com "Guardar em Ficheiros"); sem suporte, abre-se o blob numa nova aba para o
// próprio Safari oferecer a gravação; no desktop/Android mantém-se o <a download> normal.
async function shareOrDownload(blob,filename){
 try{
  if(navigator.canShare){
   const file=new File([blob],filename,{type:blob.type||'application/octet-stream'});
   if(navigator.canShare({files:[file]})){
    await navigator.share({files:[file],title:filename});
    return;
   }
  }
 }catch(err){
  if(err&&err.name==='AbortError')return;
 }
 const url=URL.createObjectURL(blob);
 if(isIOS()){
  window.open(url,'_blank');
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  return;
 }
 const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* ---- Datas estipuladas → calendário do iPhone (.ics, sempre opcional) ---- */
function icsEscape(s){return String(s||'').replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
function icsDate(d){return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'}
function buildIcs({title,date,time,description,location}){
 const start=new Date(`${date}T${time||'09:00'}:00`);
 if(isNaN(start.getTime()))return null;
 const end=new Date(start.getTime()+60*60*1000);
 return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PeriGest//PT','CALSCALE:GREGORIAN','BEGIN:VEVENT',
  'UID:'+uid()+'@perigest','DTSTAMP:'+icsDate(new Date()),'DTSTART:'+icsDate(start),'DTEND:'+icsDate(end),
  'SUMMARY:'+icsEscape(title),
  description?'DESCRIPTION:'+icsEscape(description):'',
  location?'LOCATION:'+icsEscape(location):'',
  'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
}
// Botão sempre opcional: só age quando o utilizador toca nele — nunca é automático.
actions.addToCalendar=(b)=>{
 const dateEl=document.getElementById(b.dataset.dateEl);
 const timeEl=b.dataset.timeEl?document.getElementById(b.dataset.timeEl):null;
 const date=dateEl?dateEl.value:'';
 if(!date)return alert('Defina primeiro uma data.');
 const ics=buildIcs({title:b.dataset.title,date,time:timeEl?timeEl.value:'',description:b.dataset.desc,location:b.dataset.location});
 if(!ics)return alert('Data inválida.');
 const blob=new Blob([ics],{type:'text/calendar'});
 shareOrDownload(blob,(b.dataset.title||'evento').replace(/[^\w\-]+/g,'_')+'.ics');
};

function requireAcceptedConfig(proc){
 const cfg=proc.exportConfig;
 if(!cfg||!cfg.accepted)throw new Error('É necessário validar a pré-visualização (Exportar → Pré-visualizar / validar) antes de exportar.');
 return cfg;
}
actions.exportarResumoPdf=async(b)=>{
 const proc=getProcesso(b.dataset.id);
 const st=$('expState_'+proc.id);
 try{
  const cfg=requireAcceptedConfig(proc);
  const blob=await buildResumoPdf(proc,cfg);
  shareOrDownload(blob,proc.codigo+'_Resumo.pdf');
  if(st)st.textContent='PDF gerado com sucesso.';
 }catch(err){console.error(err);if(st)st.textContent='Erro: '+(err.message||err);else alert('Erro: '+(err.message||err))}
};
actions.exportarResumoDocx=async(b)=>{
 const proc=getProcesso(b.dataset.id);
 const st=$('expState_'+proc.id);
 try{
  const cfg=requireAcceptedConfig(proc);
  const blob=await buildResumoDocx(proc,cfg);
  shareOrDownload(blob,proc.codigo+'_Resumo.docx');
  if(st)st.textContent='Word gerado com sucesso.';
 }catch(err){console.error(err);if(st)st.textContent='Erro: '+(err.message||err);else alert('Erro: '+(err.message||err))}
};
actions.exportarZipProcesso=async(b)=>{
 const proc=getProcesso(b.dataset.id);
 const st=$('expState_'+proc.id);
 try{
  const cfg=requireAcceptedConfig(proc);
  if(st)st.textContent='A preparar ZIP do processo...';
  const zip=new JSZip();
  const root=zip.folder(proc.codigo||'processo');
  root.file('dados.json',JSON.stringify(proc,null,2));
  const pdfBlob=await buildResumoPdf(proc,cfg);
  root.file(proc.codigo+'_Resumo.pdf',pdfBlob);
  const docxBlob=await buildResumoDocx(proc,cfg);
  root.file(proc.codigo+'_Resumo.docx',docxBlob);
  const fotosFolder=root.folder('Fotos');
  for(const f of (proc.fotos||[])){
   const blob=await idbGet(f.id);
   if(blob)fotosFolder.file(photoFileName(proc,f),blob);
  }
  if((proc.documentos||[]).length){
   const docsFolder=root.folder('Documentação');
   for(const d of proc.documentos){
    const blob=await idbGet(d.id,FILES_STORE);
    if(blob)docsFolder.file(d.nome,blob);
   }
  }
  const finalBlob=await zip.generateAsync({type:'blob'});
  shareOrDownload(finalBlob,(proc.codigo||'processo')+'_completo.zip');
  if(st)st.textContent='ZIP do processo gerado com sucesso.';
 }catch(err){console.error(err);if(st)st.textContent='Erro: '+(err.message||err)}
};
