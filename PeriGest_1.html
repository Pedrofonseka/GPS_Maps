<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PeriGest</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{--b:#2b4c8c;--g:#2f9161;--r:#a62c2c;--amber:#c88a15;--bg:#eef1f6;--ln:#d7dde3;--ink:#1f2933;--muted:#637381;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);padding-bottom:24px}
header{position:sticky;top:0;z-index:6;background:#132a52;color:#fff;padding:10px 14px}
header h1{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
header .rel{font-size:11px;background:#26407a;padding:2px 8px;border-radius:10px;font-weight:600}
header .ctx{opacity:.9;font-size:12.5px;margin-top:3px}
nav.tabbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--ln)}
nav.tabbar button{min-height:40px}
.crumbbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--ln);font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumbbar button{width:auto;min-height:32px;padding:5px 10px;font-size:12.5px}
main{max-width:880px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 7px #0000000d}
.card h2{margin:0 0 10px;font-size:16px}
.card h3{margin:14px 0 8px;font-size:14px;color:var(--b)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.actions.one{grid-template-columns:1fr}
.actions.three{grid-template-columns:repeat(3,1fr)}
label{display:block;font-weight:700;font-size:13.5px;margin:10px 0 5px}
label.inline{display:flex;align-items:center;gap:8px;font-weight:400;margin:8px 0}
input,select,textarea{width:100%;padding:11px;border:1px solid #b8c2cc;border-radius:8px;font:inherit;font-size:16px;background:#fff}
textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:9px;padding:10px 12px;min-height:44px;background:var(--b);color:#fff;font-weight:700;font:inherit;font-size:14px;cursor:pointer;line-height:1.25}
.secondary{background:#5b6b7d}
.green{background:var(--g)}
.amber{background:var(--amber)}
.danger{background:var(--r)}
.linklike{background:none;border:0;padding:0;min-height:auto;color:var(--b);text-decoration:underline;font-weight:600;font-size:12.5px;cursor:pointer}
.fieldlink{display:flex;align-items:center;gap:8px}
.fieldlink select{flex:1}
.status{padding:9px 10px;background:#f5f7f9;border:1px solid var(--ln);border-radius:8px;color:var(--muted);font-size:13px;margin:8px 0}
.note{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11.5px;font-weight:700;color:#fff;margin-left:6px}
.pill.on{background:var(--g)}
.pill.off{background:var(--r)}
.pill.end{background:#5b6b7d}
.pill.analise{background:var(--amber)}
.pill.relatorio{background:var(--b)}
.item{border:1px solid var(--ln);border-radius:10px;padding:11px;margin:8px 0;cursor:pointer;background:#fbfcfd}
.item:active{background:#f0f3f7}
.item b{display:block;font-size:14.5px}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.item-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.item-actions button{width:auto;min-width:0;padding:6px 12px;font-size:12.5px;min-height:34px}
.block-title{margin:22px 0 10px;padding:9px 12px;background:#132a52;color:#fff;border-radius:9px;font-size:14.5px;font-weight:800}
.block-title:first-of-type{margin-top:4px}
hr{border:0;border-top:1px solid var(--ln);margin:14px 0}
.grid-cols{display:grid;gap:8px}
.photo-cell{border:1px solid var(--ln);border-radius:10px;background:#fafbfc;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.photo-cell img{width:100%;height:120px;object-fit:cover;border-radius:7px;display:block;cursor:pointer;background:#e3e8ee}
.photo-cell .cap{font-size:11.5px;color:var(--muted);text-align:center;word-break:break-word}
.photo-cell .flag{font-size:11px;color:var(--r);font-weight:700}
.photo-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.photo-actions button{width:auto;min-height:28px;padding:4px 8px;font-size:11px}
.modal-overlay{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#fff;border-radius:14px 14px 0 0;padding:16px;width:100%;max-width:640px;max-height:92vh;overflow:auto}
@media(min-width:640px){.modal-overlay{align-items:center}.modal-box{border-radius:14px}}
.modal-box img.big{width:100%;max-height:46vh;object-fit:contain;border-radius:10px;background:#eee;margin-bottom:10px}
.hidden{display:none!important}
.searchbar{position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:3}
@media(max-width:620px){.row,.row3{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions.three{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<header>
<h1>🧭 PeriGest <span class="rel" id="relBadge">v1 · rel 1.0</span></h1>
<div class="ctx" id="headCtx">Sem contexto ativo</div>
</header>
<nav class="tabbar">
<button type="button" data-action="goHome">🏠 Pedidos &amp; Processos</button>
<button type="button" class="secondary" data-action="goSettings">⚙️ Configurações</button>
</nav>
<div class="crumbbar" id="crumbbar"></div>
<main id="main"></main>

<script>
/* ===================== Estado / Persistência ===================== */
const LS_KEY='perigest_v1_state';
const DB_NAME='perigest_v1_photos', STORE='photos';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function pad(n,l){n=String(n);while(n.length<(l||2))n='0'+n;return n}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function todayISO(){return new Date().toISOString().slice(0,10)}

function defaultState(){
 return {
  schema:1,
  pedidos:[],
  processos:[],
  intervenientes:[],
  funcoes:[{id:uid(),nome:'Perito'},{id:uid(),nome:'Mandatário'},{id:uid(),nome:'Topógrafo'}],
  siglasQuestao:[{id:uid(),sigla:'Qs',nome:'Questão'},{id:uid(),sigla:'Tm',nome:'Tema'}],
  settings:{
   release:'1.0',
   fotoGridCols:3,
   fotoResolutionKB:300,
   layout:{pageSize:'a4',font:'helvetica',fontSize:10,marginLeft:2.0,marginTop:2.2,marginRight:1.5,marginBottom:1.5},
   cabecalho:{linha1:'PeriGest',linha2Modo:'processo',tamanho:9,negrito:true},
   rodape:{esquerda:'{processo}',centro:'{pagina}/{paginas}',direita:'{data}',tamanho:8}
  }
 };
}
let app=null;
function loadState(){
 try{const raw=localStorage.getItem(LS_KEY);app=raw?JSON.parse(raw):defaultState()}catch(e){console.error('Falha a ler estado local',e);app=defaultState()}
 if(!app.settings)app.settings=defaultState().settings;
 if(!app.funcoes||!app.funcoes.length)app.funcoes=defaultState().funcoes;
 if(!app.siglasQuestao||!app.siglasQuestao.length)app.siglasQuestao=defaultState().siglasQuestao;
}
let saveTimer=null;
function save(){
 clearTimeout(saveTimer);
 saveTimer=setTimeout(()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(app))}catch(e){alert('Não foi possível gravar: espaço local esgotado. Faça Backup_OUT e considere eliminar fotos antigas.')}},350);
}
function saveNow(){clearTimeout(saveTimer);try{localStorage.setItem(LS_KEY,JSON.stringify(app))}catch(e){alert('Não foi possível gravar: espaço local esgotado.')}}

/* ===================== IndexedDB (fotos) ===================== */
let _dbP=null;
function idb(){
 if(_dbP)return _dbP;
 _dbP=new Promise((res,rej)=>{
  const rq=indexedDB.open(DB_NAME,1);
  rq.onupgradeneeded=()=>rq.result.createObjectStore(STORE);
  rq.onsuccess=()=>res(rq.result);
  rq.onerror=()=>rej(rq.error);
 });
 return _dbP;
}
async function idbPut(k,v){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDel(k){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
const photoUrlCache={};
async function getPhotoUrl(id){
 if(photoUrlCache[id])return photoUrlCache[id];
 const blob=await idbGet(id);
 if(!blob)return '';
 const url=URL.createObjectURL(blob);
 photoUrlCache[id]=url;
 return url;
}
async function hydratePhotos(root){
 const imgs=(root||document).querySelectorAll('img[data-photo-id]:not([data-hydrated])');
 for(const img of imgs){
  img.setAttribute('data-hydrated','1');
  const url=await getPhotoUrl(img.getAttribute('data-photo-id'));
  if(url)img.src=url;
 }
}

/* ===================== Navegação ===================== */
const ui={view:'pedidos',params:{},stack:[]};
function nav(view,params){
 params=params||{};
 if(params.returnView&&params._backLen==null)params._backLen=ui.stack.length;
 ui.stack.push({view:ui.view,params:ui.params});ui.view=view;ui.params=params;render()
}
function navReplace(view,params){ui.view=view;ui.params=params||{};render()}
function back(){const p=ui.stack.pop();if(p){ui.view=p.view;ui.params=p.params}else{ui.view='pedidos';ui.params={}}render()}
function goHome(){ui.stack=[];ui.view='pedidos';ui.params={};render()}
function goSettings(){nav('settings',{})}
// "Voltar ao formulário anterior" (padrão link→tabela→regresso): trunca a pilha até
// ao ponto anterior ao desvio, para o "Voltar" global não repetir esse desvio.
function navReturn(view,params,backLen){
 if(backLen!=null&&!isNaN(backLen))ui.stack.length=Math.max(0,backLen);
 ui.view=view;ui.params=params||{};render();
}

/* ===================== Helpers de dados ===================== */
function getPedido(id){return app.pedidos.find(p=>p.id===id)}
function getProcesso(id){return app.processos.find(p=>p.id===id)}
function processoDoPedido(pedidoId){return app.processos.find(p=>p.pedidoId===pedidoId)}
function getInterveniente(id){return app.intervenientes.find(i=>i.id===id)}
function getFuncaoNome(id){const f=app.funcoes.find(x=>x.id===id);return f?f.nome:'—'}
function siglaObj(id){return app.siglasQuestao.find(s=>s.id===id)||app.siglasQuestao[0]}
function autoresDoProcesso(proc){return (proc.autores||[]).slice().sort((a,b)=>a.ordem-b.ordem)}
function questoesDoAutor(proc,autorId){return (proc.questoes||[]).filter(q=>q.autorId===autorId).sort((a,b)=>a.numero-b.numero)}
function questoesOrdenadas(proc){
 const autores=autoresDoProcesso(proc);
 let out=[];
 autores.forEach(a=>{questoesDoAutor(proc,a.id).forEach(q=>out.push({q,a}))});
 return out;
}
function questaoCodigo(q,a){const sg=siglaObj(q.siglaId);return `${a.ordem}-${sg.sigla}_${pad(q.numero)}`}
function questaoTitulo(q,a){return `${questaoCodigo(q,a)} – ${q.descricaoResumida||'(sem descrição)'}`}
function peritosDoProcesso(proc){return (proc.peritos||[]).map(p=>({...p,interveniente:getInterveniente(p.intervenienteId)})).filter(p=>p.interveniente)}
function fotosDaQuestao(proc,questaoId){return (proc.fotos||[]).filter(f=>f.questaoId===questaoId)}
function fotosCapa(proc){return (proc.fotos||[]).filter(f=>f.isCapa)}

function logEvento(proc,msg){
 if(!proc.log)proc.log=[];
 proc.log.push({at:new Date().toISOString(),msg});
}
function touch(proc){proc.updatedAt=new Date().toISOString()}

/* ===================== Render raiz ===================== */
function $(id){return document.getElementById(id)}
function render(){
 $('relBadge').textContent=`v1 · rel ${app.settings.release||'1.0'}`;
 renderCrumb();
 renderCtx();
 const views={
  pedidos:viewPedidos, pedidoForm:viewPedidoForm,
  processos:viewProcessos, processo:viewProcesso,
  autores:viewAutores,
  questoes:viewQuestoes, questaoForm:viewQuestaoForm, importQuestoes:viewImportQuestoes,
  peritos:viewPeritos,
  eventos:viewEventos, eventoForm:viewEventoForm,
  analise:viewAnalise, analiseQuestao:viewAnaliseQuestao,
  relatorio:viewRelatorio,
  fotos:viewFotos,
  settings:viewSettings,
  intervenientes:viewIntervenientes, intervenienteForm:viewIntervenienteForm,
  funcoes:viewFuncoes, siglas:viewSiglas
 };
 const fn=views[ui.view]||viewPedidos;
 $('main').innerHTML=fn(ui.params||{});
 wireCommon();
 hydratePhotos($('main'));
}
function renderCrumb(){
 const bar=$('crumbbar');
 const labels={pedidos:'Pedidos',pedidoForm:'Pedido',processos:'Processos',processo:'Processo',autores:'Autores',questoes:'Questões',questaoForm:'Questão',importQuestoes:'Importar questões',peritos:'Peritos',eventos:'Eventos',eventoForm:'Evento',analise:'Análise',analiseQuestao:'Análise da questão',relatorio:'Relatório provisório',fotos:'Fotografias',settings:'Configurações',intervenientes:'Intervenientes',intervenienteForm:'Interveniente',funcoes:'Funções',siglas:'Siglas de questão'};
 if(ui.stack.length===0){bar.innerHTML='';return}
 bar.innerHTML=`<button type="button" data-action="back">‹ Voltar</button><span>${esc(labels[ui.view]||'')}</span>`;
}
function renderCtx(){
 const el=$('headCtx');
 if(ui.view==='processo'||ui.params.processoId){
  const proc=getProcesso(ui.params.processoId||(ui.view==='processo'?ui.params.id:null));
  if(proc){el.textContent=`Processo: ${proc.codigo||'(sem código)'} ${proc.local?('· '+proc.local):''}`;return}
 }
 el.textContent='Sem contexto ativo';
}

/* ===================== UI helpers ===================== */
function card(title,body){return `<div class="card"><h2>${title}</h2>${body}</div>`}
function field(label,inner,note){return `<label>${esc(label)}${note?` <small class="note">${esc(note)}</small>`:''}</label>${inner}`}
function statusPill(status){const map={ON:'on',OFF:'off',END:'end'};return `<span class="pill ${map[status]||''}">${status}</span>`}
function fasePill(fase){return fase==='relatorio'?'<span class="pill relatorio">Relatório</span>':'<span class="pill analise">Análise</span>'}
function linkBtn(label,view,params){return `<button type="button" class="linklike" data-action="navTo" data-view="${view}" data-params='${esc(JSON.stringify(params||{}))}'>${esc(label)}</button>`}
function fieldWithLink(selectHtml,linkLabel,view,params){return `<div class="fieldlink">${selectHtml}${linkBtn(linkLabel,view,params)}</div>`}

/* ===================== Wiring genérico (delegação de eventos) ===================== */
let wired=false;
function wireCommon(){
 if(wired)return;wired=true;
 document.addEventListener('click',onClick);
 document.addEventListener('input',onInput);
 document.addEventListener('change',onChange);
}
function onClick(e){
 const b=e.target.closest('[data-action]');
 if(!b)return;
 const action=b.dataset.action;
 const handler=actions[action];
 if(handler)handler(b,e);
}
function onInput(e){
 const t=e.target;
 if(t.matches('[data-bind]'))bindField(t);
}
function onChange(e){
 const t=e.target;
 if(t.matches('[data-bind]'))bindField(t);
 if(t.matches('[data-bind-immediate]'))bindField(t,true);
}
function pathGet(obj,path){return path.split('.').reduce((o,k)=>o==null?o:o[k],obj)}
function pathSet(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=val}
function resolveBindRoot(t){
 const scope=t.dataset.scope;
 if(scope==='processo')return getProcesso(t.dataset.scopeId||ui.params.processoId||ui.params.id);
 if(scope==='pedido')return getPedido(t.dataset.scopeId||ui.params.id);
 if(scope==='settings')return app.settings;
 if(scope==='interveniente')return getInterveniente(t.dataset.scopeId);
 return app;
}
function bindField(t){
 const root=resolveBindRoot(t);
 if(!root)return;
 let val=t.type==='checkbox'?t.checked:t.value;
 if(t.type==='number')val=val===''?'':Number(val);
 pathSet(root,t.dataset.bind,val);
 if(t.dataset.scope==='processo'){const p=getProcesso(t.dataset.scopeId||ui.params.processoId||ui.params.id);if(p)touch(p)}
 save();
}

/* ===================== Ações ===================== */
const actions={};
actions.goHome=()=>goHome();
actions.goSettings=()=>goSettings();
actions.back=()=>back();
actions.navTo=(b)=>{const view=b.dataset.view;const params=JSON.parse(b.dataset.params||'{}');nav(view,params)};
actions.navReturn=(b)=>{const view=b.dataset.view;const params=JSON.parse(b.dataset.params||'{}');navReturn(view,params,Number(b.dataset.backlen))};

/* ---- Pedidos ---- */
function viewPedidos(){
 const list=app.pedidos.slice().sort((a,b)=>(b.dataPedido||'').localeCompare(a.dataPedido||''));
 return card('📋 Pedidos de peritagem', `
  <div class="actions one"><button type="button" data-action="novoPedido">➕ Novo pedido</button></div>
  <div>${list.length?list.map(p=>`
   <div class="item" data-action="abrirPedido" data-id="${p.id}">
    <b>${esc(p.codigo||'(sem código)')} — ${esc(p.solicitante||'(sem solicitante)')} ${statusPill(p.status)}</b>
    <div class="meta">${esc(p.assunto||'')}</div>
    <div class="meta">Local: ${esc(p.local||'—')} · Data: ${esc(p.dataPedido||'—')} · Prazo: ${esc(p.prazo||'—')}</div>
   </div>`).join(''):'<div class="note">Ainda não há pedidos.</div>'}</div>
  <div class="actions one" style="margin-top:14px"><button type="button" class="secondary" data-action="navProcessos">📁 Ver processos</button></div>
 `);
}
actions.navProcessos=()=>nav('processos',{});
actions.novoPedido=()=>{
 const p={id:uid(),codigo:'PED-'+pad(app.pedidos.length+1,3),solicitante:'',contacto:'',email:'',dataPedido:todayISO(),finalidade:'',assunto:'',local:'',prazo:'',status:'',motivo:'',createdAt:new Date().toISOString()};
 app.pedidos.push(p);saveNow();
 nav('pedidoForm',{id:p.id});
};
actions.abrirPedido=(b)=>nav('pedidoForm',{id:b.dataset.id});

function viewPedidoForm(params){
 const p=getPedido(params.id);
 if(!p)return card('Pedido','<div class="note">Pedido não encontrado.</div>');
 const proc=processoDoPedido(p.id);
 return card(`📋 Pedido — ${esc(p.codigo)}`, `
  ${field('Código provisório','<input data-bind="codigo" data-scope="pedido" data-scope-id="'+p.id+'" value="'+esc(p.codigo)+'">')}
  ${field('Solicitante','<input data-bind="solicitante" data-scope="pedido" data-scope-id="'+p.id+'" value="'+esc(p.solicitante)+'">')}
  <div class="row">
   ${field('Contacto telefónico','<input data-bind="contacto" data-scope="pedido" data-scope-id="'+p.id+'" value="'+esc(p.contacto)+'">')}
   ${field('E-mail','<input type="email" data-bind="email" data-scope="pedido" data-scope-id="'+p.id+'" value="'+esc(p.email)+'">')}
  </div>
  <div class="row">
   ${field('Data do pedido','<input type="date" data-bind="dataPedido" data-scope="pedido" data-scope-id="'+p.id+'" value="'+esc(p.dataPedido)+'">')}
   ${field('Prazo','<input type="date" data-bind="prazo" data-scope="pedido" data-scope-id="'+p.id+'" value="'+esc(p.prazo)+'">')}
  </div>
  ${field('Finalidade','<textarea data-bind="finalidade" data-scope="pedido" data-scope-id="'+p.id+'">'+esc(p.finalidade)+'</textarea>')}
  ${field('Assunto a resolver','<textarea data-bind="assunto" data-scope="pedido" data-scope-id="'+p.id+'">'+esc(p.assunto)+'</textarea>')}
  ${field('Local','<input data-bind="local" data-scope="pedido" data-scope-id="'+p.id+'" value="'+esc(p.local)+'">')}
  <hr>
  <label>Estado</label>
  <div class="actions three">
   <button type="button" class="${p.status==='ON'?'green':'secondary'}" data-action="setPedidoStatus" data-id="${p.id}" data-status="ON">ON</button>
   <button type="button" class="${p.status==='OFF'?'danger':'secondary'}" data-action="setPedidoStatus" data-id="${p.id}" data-status="OFF">OFF</button>
   <button type="button" class="${p.status==='END'?'amber':'secondary'}" data-action="setPedidoStatus" data-id="${p.id}" data-status="END">END</button>
  </div>
  ${p.status==='OFF'?field('Motivo / Observações','<textarea data-bind="motivo" data-scope="pedido" data-scope-id="'+p.id+'">'+esc(p.motivo)+'</textarea>'):''}
  ${proc?`<div class="status">Processo criado: <b>${esc(proc.codigo)}</b> — ${linkBtn('abrir processo','processo',{id:proc.id})}</div>`:'<div class="note">Ao colocar o estado em ON é criado automaticamente o processo correspondente.</div>'}
  <div class="actions one" style="margin-top:10px"><button type="button" class="danger" data-action="apagarPedido" data-id="${p.id}">🗑 Eliminar pedido</button></div>
 `);
}
actions.setPedidoStatus=(b)=>{
 const p=getPedido(b.dataset.id);if(!p)return;
 p.status=b.dataset.status;

function addQuestoesFromLines(proc,autorId,lines){
 let n=questoesDoAutor(proc,autorId).reduce((m,q)=>Math.max(m,q.numero),0);
 let count=0;
 lines.map(l=>l.trim()).filter(Boolean).forEach(txt=>{
  n++;count++;
  proc.questoes.push({id:uid(),autorId,numero:n,siglaId:proc.siglaId,descricaoResumida:txt.slice(0,140),descricaoCompleta:txt,fase:'analise',respostas:{},conciliada:{texto:'',aceite:false},createdAt:new Date().toISOString()});
 });
 touch(proc);logEvento(proc,count+' questão(ões) importada(s)');
 return count;
}

 const proc=getProcesso(b.dataset.processo);
 const autorId=$('importAutor').value;
 const lines=$('importText').value.split('\n');
 const n=addQuestoesFromLines(proc,autorId,lines);
 saveNow();
 $('importText').value='';
 $('importState').textContent=n+' questão(ões) importada(s) com sucesso.';
 render();
};
actions.importarFicheiro=async(b)=>{
 const proc=getProcesso(b.dataset.processo);
 const autorId=$('importAutor').value;
 const file=$('importFile').files[0];
 if(!file){alert('Escolha um ficheiro.');return}
 const st=$('importState');st.textContent='A processar...';
 try{
  let lines=[];
  const name=file.name.toLowerCase();
  if(name.endsWith('.txt')||name.endsWith('.csv')){
   const txt=await file.text();
   lines=txt.split('\n').map(l=>l.split(',')[0]);
  }else if(name.endsWith('.docx')){
   const zip=await JSZip.loadAsync(file);
   const xml=await zip.file('word/document.xml').async('text');
   lines=xml.split('</w:p>').map(p=>p.replace(/<[^>]+>/g,'')).map(s=>s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim());
  }else if(name.endsWith('.xlsx')){
   const zip=await JSZip.loadAsync(file);
   let shared=[];
   const sharedFile=zip.file('xl/sharedStrings.xml');
   if(sharedFile){
    const sxml=await sharedFile.async('text');
    shared=(sxml.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[]).map(t=>t.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'));
   }
   const sheetFile=zip.file('xl/worksheets/sheet1.xml');
   const sxml=sheetFile?await sheetFile.async('text'):'';
   const rows=sxml.split('</row>');
   rows.forEach(row=>{
    const m=row.match(/<c[^>]*r="A\d+"[^>]*>([\s\S]*?)<\/c>/);
    if(!m)return;
    const isShared=/t="s"/.test(m[0]);
    const vMatch=m[1].match(/<v>([\s\S]*?)<\/v>/);
    if(!vMatch)return;
    const val=isShared?shared[Number(vMatch[1])]:vMatch[1];
    if(val)lines.push(val);
   });
  }else{
   alert('Formato não suportado.');st.textContent='';return;
  }
  const n=addQuestoesFromLines(proc,autorId,lines);
  saveNow();
  st.textContent=n+' questão(ões) importada(s) de '+file.name+'.';
  render();
 }catch(err){
  console.error(err);
  st.textContent='Erro ao importar: '+(err.message||err);
 }
};

 return EVENTO_TIPOS.map(([key,label])=>{
  const evs=(proc.eventos||[]).filter(e=>e.tipo===key).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  return card(`🗓️ ${label}s`, `
   <div>${evs.length?evs.map(e=>`
    <div class="item" data-action="navTo" data-view="eventoForm" data-params='${esc(JSON.stringify({processoId:proc.id,id:e.id}))}'>
     <b>${esc(e.data||'(sem data)')}</b>

     ${key!=='informacao'?`<div class="meta">${(e.presencas||[]).length} presença(s)</div>`:''}

   <div class="actions one"><button type="button" data-action="novoEvento" data-processo="${proc.id}" data-tipo="${key}">➕ Novo(a) ${label.toLowerCase()}</button></div>
  `);
 }).join('');
}

document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id!=='fotoGallery'&&t.id!=='fotoCamera')return;
 const proc=getProcesso(t.dataset.processo);if(!proc)return;
 const questaoId=t.dataset.questao||null;

 if(!files.length)return;
 for(const file of files){
  await processarNovaFoto(proc,questaoId,file);
 }
 t.value='';
 saveNow();render();
});
async function compressImage(file,targetKB){
 const img=await fileToImage(file);
 let w=img.width,h=img.height;
 const maxSide=2000;
 if(Math.max(w,h)>maxSide){const s=maxSide/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
 const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
 let q=0.85,blob=await canvasToBlob(canvas,q);
 if(targetKB!=='original'){
  const targetBytes=Number(targetKB)*1024;
  let tries=0;
  while(blob.size>targetBytes&&q>0.35&&tries<8){q-=0.1;blob=await canvasToBlob(canvas,q);tries++}
 }
 return {blob,width:w,height:h};
}
function fileToImage(file){
 return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{res(img)};
  img.onerror=rej;
  img.src=url;
 });
}
function canvasToBlob(canvas,q){return new Promise(res=>canvas.toBlob(res,'image/jpeg',q))}
async function processarNovaFoto(proc,questaoId,file){
 const {blob,width,height}=await compressImage(file,app.settings.fotoResolutionKB);
 const id=uid();
 await idbPut(id,blob);
 const orientacao=height>=width?'portrait':'landscape';
 const existentes=(proc.fotos||[]).filter(f=>questaoId?f.questaoId===questaoId:true);
 const counts={portrait:0,landscape:0};
 existentes.forEach(f=>{counts[f.orientacao]=(counts[f.orientacao]||0)+1});
 const dominante=counts.portrait>=counts.landscape?'portrait':'landscape';
 const flag=existentes.length>=2&&orientacao!==dominante;
 if(!proc.fotos)proc.fotos=[];
 proc.fotos.push({id,questaoId,caption:'',isCapa:false,width,height,orientacao,captionFlagRotacao:flag,createdAt:new Date().toISOString()});
 touch(proc);logEvento(proc,'Foto adicionada'+(questaoId?' à questão':''));
}

function abrirModal(html){
 let ov=$('modalOverlay');
 if(!ov){ov=document.createElement('div');ov.id='modalOverlay';ov.className='modal-overlay';document.body.appendChild(ov)}
 ov.innerHTML=`<div class="modal-box">${html}</div>`;
 ov.classList.remove('hidden');
 hydratePhotos(ov);
}
function fecharModal(){const ov=$('modalOverlay');if(ov)ov.remove()}
actions.rodarFoto=async(b)=>{
 const proc=getProcesso(ui.params.processoId||ui.params.id);
 const f=(proc.fotos||[]).find(x=>x.id===b.dataset.id);if(!f)return;
 const blob=await idbGet(f.id);
 const img=await fileToImage(blob);
 const canvas=document.createElement('canvas');
 canvas.width=img.height;canvas.height=img.width;
 const ctx=canvas.getContext('2d');
 ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(Math.PI/2);
 ctx.drawImage(img,-img.width/2,-img.height/2);
 const newBlob=await canvasToBlob(canvas,0.85);
 await idbPut(f.id,newBlob);
 if(photoUrlCache[f.id]){URL.revokeObjectURL(photoUrlCache[f.id]);delete photoUrlCache[f.id]}
 const w=f.width,h=f.height;f.width=h;f.height=w;
 f.orientacao=f.height>=f.width?'portrait':'landscape';
 f.captionFlagRotacao=false;
 touch(proc);saveNow();render();
};
actions.toggleCapa=(b)=>{
 const proc=getProcesso(ui.params.processoId||ui.params.id);
 const f=(proc.fotos||[]).find(x=>x.id===b.dataset.id);
 if(!f.isCapa&&fotosCapa(proc).length>=4)return alert('Máximo de 4 fotos de capa.');
 f.isCapa=!f.isCapa;
 touch(proc);saveNow();render();
};
actions.apagarFoto=async(b)=>{
 if(!confirm('Eliminar esta fotografia?'))return;
 const proc=getProcesso(b.dataset.processo);
 await idbDel(b.dataset.id);
 if(photoUrlCache[b.dataset.id]){URL.revokeObjectURL(photoUrlCache[b.dataset.id]);delete photoUrlCache[b.dataset.id]}
 proc.fotos=proc.fotos.filter(f=>f.id!==b.dataset.id);
 touch(proc);saveNow();render();
};

actions.backupOut=async(b)=>{
 const st=$('backupState');st.textContent='A preparar ZIP...';
 try{
  const zip=new JSZip();
  zip.file('dados.json',JSON.stringify(app,null,2));
  const fotos=zip.folder('fotos');
  const allProcFotos=app.processos.flatMap(p=>p.fotos||[]);
  for(const f of allProcFotos){
   const blob=await idbGet(f.id);
   if(blob)fotos.file(f.id+'.jpg',blob);
  }
  const blob=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='PeriGest_backup_'+todayISO()+'.zip';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  st.textContent='Backup_OUT concluído: '+allProcFotos.length+' foto(s) incluída(s).';
 }catch(err){console.error(err);st.textContent='Erro no Backup_OUT: '+(err.message||err)}
};
actions.backupInTrigger=()=>$('backupInFile').click();
document.addEventListener('change',async e=>{
 if(e.target.id!=='backupInFile')return;
 const file=e.target.files[0];if(!file)return;
 if(!confirm('Restaurar esta cópia substitui os dados atuais. Continuar?'))return;
 const st=$('backupState');st.textContent='A restaurar...';
 try{
  const zip=await JSZip.loadAsync(file);
  const json=await zip.file('dados.json').async('text');
  const restored=JSON.parse(json);
  const fotosFolder=zip.folder('fotos');
  const files=fotosFolder?Object.keys(fotosFolder.files).filter(n=>!fotosFolder.files[n].dir):[];
  for(const name of files){
   const entry=zip.file(name);
   if(!entry)continue;
   const id=name.split('/').pop().replace('.jpg','');
   const blob=await entry.async('blob');
   await idbPut(id,blob);
  }
  app=restored;saveNow();
  Object.keys(photoUrlCache).forEach(k=>{URL.revokeObjectURL(photoUrlCache[k]);delete photoUrlCache[k]});
  st.textContent='Backup_IN concluído: '+files.length+' foto(s) restaurada(s).';
  goHome();
 }catch(err){console.error(err);st.textContent='Erro no Backup_IN: '+(err.message||err)}
 e.target.value='';
});
actions.apagarTudo=async()=>{
 if(!confirm('Eliminar TODOS os dados locais (pedidos, processos, fotos)? Esta ação não pode ser revertida sem um Backup_OUT prévio.'))return;
 app=defaultState();saveNow();
 const d=await idb();
 await new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
 Object.keys(photoUrlCache).forEach(k=>{URL.revokeObjectURL(photoUrlCache[k]);delete photoUrlCache[k]});
 goHome();
};

/* ===================== Exportação PDF / Word / ZIP ===================== */
function fillFooterTemplate(tpl,ctx){
 return String(tpl||'').replace(/\{processo\}/g,ctx.processo||'').replace(/\{pagina\}/g,ctx.pagina||'').replace(/\{paginas\}/g,ctx.paginas||'').replace(/\{data\}/g,ctx.data||'');
}
function buildResumoPdf(proc){
 if(!(window.jspdf&&window.jspdf.jsPDF))throw new Error('O gerador de PDF ainda não carregou. Verifique a ligação à internet.');
 const {jsPDF}=window.jspdf;
 const s=app.settings,L=s.layout;
 const doc=new jsPDF({unit:'mm',format:L.pageSize||'a4'});
 const F=L.font||'helvetica',BS=Number(L.fontSize)||10;
 const mL=(Number(L.marginLeft)||2)*10,mT=(Number(L.marginTop)||2)*10,mR=(Number(L.marginRight)||1.5)*10,mB=(Number(L.marginBottom)||1.5)*10;
 const pageW=doc.internal.pageSize.getWidth(),pageH=doc.internal.pageSize.getHeight(),contentW=pageW-mL-mR;
 const drawHeader=()=>{
  doc.setFont(F,s.cabecalho.negrito?'bold':'normal');doc.setFontSize(s.cabecalho.tamanho||9);
  doc.text(s.cabecalho.linha1||'PeriGest',mL,mT-6);
  doc.text(proc.codigo||'',pageW-mR,mT-6,{align:'right'});
  doc.setDrawColor(180);doc.line(mL,mT-3,pageW-mR,mT-3);
 };
 const drawFooter=(p,total)=>{
  const ctx={processo:proc.codigo,pagina:String(p),paginas:String(total),data:new Date().toLocaleDateString('pt-PT')};
  doc.setFont(F,'normal');doc.setFontSize(s.rodape.tamanho||8);doc.setTextColor(90);
  const y=pageH-mB+8;
  doc.text(fillFooterTemplate(s.rodape.esquerda,ctx),mL,y);
  doc.text(fillFooterTemplate(s.rodape.centro,ctx),pageW/2,y,{align:'center'});
  doc.text(fillFooterTemplate(s.rodape.direita,ctx),pageW-mR,y,{align:'right'});
  doc.setTextColor(0);
 };
 let y=mT;
 const ensure=(needed)=>{if(y+needed>pageH-mB){doc.addPage();drawHeader();y=mT+6}};
 drawHeader();y=mT+6;
 doc.setFont(F,'bold');doc.setFontSize(BS+8);
 doc.text('Resumo da situação à data',mL,y);y+=10;
 doc.setFont(F,'normal');doc.setFontSize(BS);
 const infoLines=[
  ['Código de processo',proc.codigo],['Nº processo',proc.numero],['Solicitante institucional',proc.solicitanteInstitucional],
  ['Designação',proc.designacaoInstitucional],['Local',proc.local],['Assunto a resolver',proc.assunto]
 ];
 infoLines.forEach(([label,val])=>{
  const wrapped=doc.splitTextToSize(`${label}: ${val||'—'}`,contentW);
  ensure(wrapped.length*BS*0.45+2);
  doc.text(wrapped,mL,y);y+=wrapped.length*BS*0.45+2;
 });
 y+=4;
 doc.setFont(F,'bold');doc.setFontSize(BS+3);ensure(8);doc.text('Peritos',mL,y);y+=7;
 doc.setFont(F,'normal');doc.setFontSize(BS);
 const peritos=peritosDoProcesso(proc);
 if(!peritos.length){ensure(6);doc.text('—',mL,y);y+=6}
 peritos.forEach(p=>{ensure(6);doc.text(`${p.interveniente.nome} — ${p.representa}`,mL,y);y+=6});
 y+=4;
 doc.setFont(F,'bold');doc.setFontSize(BS+3);ensure(8);doc.text('Questões',mL,y);y+=7;
 questoesOrdenadas(proc).forEach(({q,a})=>{
  doc.setFont(F,'bold');doc.setFontSize(BS);
  const titulo=doc.splitTextToSize(questaoTitulo(q,a),contentW);
  ensure(titulo.length*BS*0.45+4);
  doc.text(titulo,mL,y);y+=titulo.length*BS*0.45+2;
  doc.setFont(F,'normal');doc.setFontSize(Math.max(6,BS-1));
  const status=doc.splitTextToSize(`Fase: ${q.fase==='relatorio'?'Relatório provisório':'Análise'}`,contentW);
  ensure(status.length*BS*0.4+4);
  doc.text(status,mL,y);y+=status.length*BS*0.4+5;
 });
 // Relatório provisório — questão a questão, com quebra de página
 const relatorio=questoesOrdenadas(proc).filter(x=>x.q.fase==='relatorio');
 if(relatorio.length){
  doc.addPage();drawHeader();y=mT+6;
  doc.setFont(F,'bold');doc.setFontSize(BS+8);
  doc.text('Relatório provisório',mL,y);y+=10;
  relatorio.forEach(({q,a},idx)=>{
   if(idx>0){doc.addPage();drawHeader();y=mT+6}
   doc.setFont(F,'bold');doc.setFontSize(BS+2);
   const titulo=doc.splitTextToSize(questaoTitulo(q,a),contentW);
   ensure(titulo.length*BS*0.45+4);doc.text(titulo,mL,y);y+=titulo.length*BS*0.45+4;
   doc.setFont(F,'normal');doc.setFontSize(BS);
   const corpo=doc.splitTextToSize(q.conciliada.texto||'(sem texto conciliado)',contentW);
   corpo.forEach(line=>{ensure(BS*0.45+1);doc.text(line,mL,y);y+=BS*0.45+1});
  });
 }
 const total=doc.internal.getNumberOfPages();
 for(let p=1;p<=total;p++){doc.setPage(p);drawFooter(p,total)}
 return doc.output('blob');
}
async function buildResumoDocx(proc){
 const zip=new JSZip();
 const s=app.settings,F=(s.layout.font==='courier'?'Courier New':s.layout.font==='times'?'Times New Roman':'Calibri');
 const szBody=(Number(s.layout.fontSize)||10)*2,szTitle=szBody+16,szHead=szBody+6;
 const cm2tw=v=>Math.round((Number(v)||0)*566.9);
 const mL=cm2tw(s.layout.marginLeft),mT=cm2tw(s.layout.marginTop),mR=cm2tw(s.layout.marginRight),mB=cm2tw(s.layout.marginBottom);
 const pgW=11906,pgH=16838;
 const run=(text,o)=>{o=o||{};let rpr='<w:rPr>';if(o.font)rpr+='<w:rFonts w:ascii="'+o.font+'" w:hAnsi="'+o.font+'"/>';if(o.bold)rpr+='<w:b/>';rpr+='<w:sz w:val="'+(o.size||szBody)+'"/></w:rPr>';return '<w:r>'+rpr+'<w:t xml:space="preserve">'+esc(text)+'</w:t></w:r>'};
 const para=(inner,o)=>{o=o||{};let ppr='<w:pPr><w:spacing w:after="'+(o.after!=null?o.after:120)+'"/></w:pPr>';return '<w:p>'+ppr+inner+'</w:p>'};
 const parts=[];
 parts.push(para(run('Resumo da situação à data',{bold:true,font:F,size:szTitle}),{after:200}));
 [['Código de processo',proc.codigo],['Nº processo',proc.numero],['Solicitante institucional',proc.solicitanteInstitucional],['Designação',proc.designacaoInstitucional],['Local',proc.local],['Assunto a resolver',proc.assunto]].forEach(([l,v])=>{
  parts.push(para(run(l+': ',{bold:true,font:F})+run(String(v||'—'),{font:F})));
 });
 parts.push(para(run('Peritos',{bold:true,font:F,size:szHead}),{after:100}));
 const peritos=peritosDoProcesso(proc);
 if(!peritos.length)parts.push(para(run('—',{font:F})));
 peritos.forEach(p=>parts.push(para(run(p.interveniente.nome+' — '+p.representa,{font:F}))));
 parts.push(para(run('Questões',{bold:true,font:F,size:szHead}),{after:100}));
 questoesOrdenadas(proc).forEach(({q,a})=>{
  parts.push(para(run(questaoTitulo(q,a),{bold:true,font:F})));
  parts.push(para(run('Fase: '+(q.fase==='relatorio'?'Relatório provisório':'Análise'),{font:F}),{after:160}));
 });
 const relatorio=questoesOrdenadas(proc).filter(x=>x.q.fase==='relatorio');
 if(relatorio.length){
  parts.push(para(run('Relatório provisório',{bold:true,font:F,size:szTitle}),{after:200,sectPr:undefined}));
  relatorio.forEach(({q,a},idx)=>{
   parts.push(para(run(questaoTitulo(q,a),{bold:true,font:F,size:szHead}),{after:100}));
   parts.push(para(run(q.conciliada.texto||'(sem texto conciliado)',{font:F}),{after:200}));
   if(idx<relatorio.length-1)parts.push('<w:p><w:r><w:br w:type="page"/></w:r></w:p>');
  });
 }
 parts.push(para('',{sectPr:'<w:sectPr><w:pgSz w:w="'+pgW+'" w:h="'+pgH+'"/><w:pgMar w:top="'+mT+'" w:right="'+mR+'" w:bottom="'+mB+'" w:left="'+mL+'"/></w:sectPr>'}));
 const documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+parts.map(p=>typeof p==='string'?p:p).join('')+'<w:sectPr><w:pgSz w:w="'+pgW+'" w:h="'+pgH+'"/><w:pgMar w:top="'+mT+'" w:right="'+mR+'" w:bottom="'+mB+'" w:left="'+mL+'"/></w:sectPr></w:body></w:document>';
 zip.file('word/document.xml',documentXml);
 zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
 zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
 return await zip.generateAsync({type:'blob'});
}
function shareOrDownload(blob,filename){
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),4000);
}
actions.exportarResumoPdf=(b)=>{
 const proc=getProcesso(b.dataset.id);
 const st=$('expState_'+proc.id);
 try{
  const blob=buildResumoPdf(proc);
  shareOrDownload(blob,proc.codigo+'_Resumo.pdf');
  if(st)st.textContent='PDF gerado com sucesso.';
 }catch(err){console.error(err);if(st)st.textContent='Erro: '+(err.message||err);else alert('Erro: '+(err.message||err))}
};
actions.exportarResumoDocx=async(b)=>{
 const proc=getProcesso(b.dataset.id);
 const st=$('expState_'+proc.id);
 try{
  const blob=await buildResumoDocx(proc);
  shareOrDownload(blob,proc.codigo+'_Resumo.docx');
  if(st)st.textContent='Word gerado com sucesso.';
 }catch(err){console.error(err);if(st)st.textContent='Erro: '+(err.message||err);else alert('Erro: '+(err.message||err))}
};
actions.exportarZipProcesso=async(b)=>{
 const proc=getProcesso(b.dataset.id);
 const st=$('expState_'+proc.id);
 if(st)st.textContent='A preparar ZIP do processo...';
 try{
  const zip=new JSZip();
  const root=zip.folder(proc.codigo||'processo');
  root.file('dados.json',JSON.stringify(proc,null,2));
  const pdfBlob=buildResumoPdf(proc);
  root.file(proc.codigo+'_Resumo.pdf',pdfBlob);
  const docxBlob=await buildResumoDocx(proc);
  root.file(proc.codigo+'_Resumo.docx',docxBlob);
  const fotosFolder=root.folder('Fotos');
  for(const f of (proc.fotos||[])){
   const blob=await idbGet(f.id);
   if(blob)fotosFolder.file(f.id+(f.caption?'_'+f.caption.slice(0,20).replace(/[^a-z0-9]+/gi,'_'):'')+'.jpg',blob);
  }
  const finalBlob=await zip.generateAsync({type:'blob'});
  shareOrDownload(finalBlob,(proc.codigo||'processo')+'_completo.zip');
  if(st)st.textContent='ZIP do processo gerado com sucesso.';
 }catch(err){console.error(err);if(st)st.textContent='Erro: '+(err.message||err)}
};

/* ===================== Arranque ===================== */
loadState();
render();
