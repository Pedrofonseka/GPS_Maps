<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rel. Peritagem">
<meta name="theme-color" content="#E3AE1F">
<title>Relatório de Peritagem</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#eaf1f8;--card:#fff;--ink:#1f2328;--mute:#5f656d;--line:#cfd9e5;--pri:#6b4f00;--pri2:#2f6aa3;--ok:#2e7d32;--okbg:#e8f5e9;--warn:#9a5b00;--warnbg:#fff4e0;--bad:#c62828;--badbg:#fdecea;--safe:150px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Calibri,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#top{position:sticky;top:0;z-index:20}
#hdr{background:var(--pri);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#hdr h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
#hdr .ver{font-size:12px;opacity:.8}
#hdr .crumbs{flex:1;font-size:13px;opacity:.95;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);font-size:13px;padding:6px 9px}
#hdr button.on{background:#fff;color:var(--pri)}
@media(max-width:430px){#hdr{gap:6px;padding-left:10px;padding-right:10px}#hdr .ver{display:none}}
#steps{display:flex;background:#fff;border-bottom:1px solid var(--line)}
#steps button{flex:1;background:#fff;color:var(--mute);border:0;border-radius:0;border-bottom:3px solid transparent;padding:11px 4px;font-weight:600;font-size:15px}
#steps button.on{color:var(--ink);border-bottom-color:var(--pri)}
#app{max-width:760px;margin:0 auto;padding:12px 14px calc(var(--safe) + env(safe-area-inset-bottom))}
h2{font-size:18px;margin:10px 0 8px;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.card.active{border-color:var(--ok);background:var(--okbg)}
.list .card{cursor:pointer}
.cardrow{display:flex;gap:8px}.mv{display:flex;flex-direction:column;gap:5px}.grow{flex:1;min-width:0}.center{text-align:center}
label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 4px}
input:not([type=checkbox]),select,textarea{width:100%;font:inherit;font-size:16px;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical;overflow:hidden;field-sizing:content}
button,.btn{font:inherit;font-size:15px;min-height:42px;padding:9px 15px;border-radius:9px;border:1px solid var(--pri2);background:var(--pri2);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;-webkit-tap-highlight-color:transparent;line-height:1.2}
button:disabled{opacity:.35}
.secondary,button.sm,.btn:not(.green){background:#fff;color:var(--pri)}
.green,.pri{background:var(--ok);border-color:var(--ok);color:#fff}
.del,.danger{background:#fff;border-color:#e0a3a3;color:var(--bad);font-size:13px;min-height:34px;padding:5px 10px}
.mini,.sm,.xs{font-size:13.5px;min-height:36px;padding:6px 11px}
.mv button{min-width:40px;min-height:36px;padding:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:2px 0 6px}.seg button{flex:1;border:0;border-radius:0;background:#fff;color:var(--pri);font-weight:600;min-height:44px}.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--pri);color:#fff}
.rows{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:4px 0}
.rw{display:flex;gap:8px;align-items:center;padding:6px 8px;background:#fff}.rows .rw+.rw{border-top:1px solid var(--line)}.rw input{flex:1;border-color:transparent;padding:6px 4px}.rw input:focus{border-color:var(--line)}
.rw.add{padding:8px 0 0;background:transparent}.rw.add input{border-color:var(--line);padding:8px 9px}
#hdr button{min-height:34px}
.btns,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.inrow{display:flex;gap:6px;align-items:center}.inrow input{flex:1}
.muted{color:var(--mute);font-size:13px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:#e6e8eb;color:var(--pri);margin:0 4px 2px 0}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
details.sec>summary{list-style:none;cursor:pointer;padding:12px;font-weight:700;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:before{content:"▸";color:var(--pri2);transition:transform .15s}
details.sec[open]>summary:before{transform:rotate(90deg)}
details.sec>summary .cnt{margin-left:auto;font-weight:400}
details.sec .body{padding:0 12px 12px}
.blk{margin:18px 0 6px;padding:9px 12px;border-radius:9px;background:var(--pri);color:#fff;font-weight:700;letter-spacing:.2px}
.blk small{display:block;font-weight:400;opacity:.85;font-size:12.5px}
.tks{display:flex;flex-wrap:wrap;gap:6px 8px;margin:2px 0 4px}.tks.col{flex-direction:column}
.ddh{display:flex;align-items:center;gap:8px;width:100%;margin:6px 0 0;padding:10px 12px;background:#f2f2f2;border:1px solid #d9d9d9;border-radius:10px;color:#222;font-size:15px;text-align:left;min-height:44px}
.ddh.on{background:#e6e6e6;border-color:#bdbdbd;border-bottom-left-radius:0;border-bottom-right-radius:0}.ddl{color:#555;font-size:13px;min-width:74px}.ddv{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ddv.muted{font-weight:400}.dda{color:#777}
.req{border-left:4px solid #2e9d4f;background:#eef8f0;border-radius:10px;padding:2px 10px 8px;margin:8px 0}.req>label:first-child,.req .ddl{color:#1e7a3c;font-weight:700}.req>label:first-child::after{content:' • a responder';font-weight:600;font-size:12px;color:#2e9d4f}.req.done{background:transparent;border-left-color:#9fd3ae}.req.done>label:first-child::after{content:' ✓';color:#2e9d4f}.req .ddh{border-color:#9fd3ae}.reqnote{font-size:12.5px;color:#1e7a3c;margin:8px 0 0}
.qbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:#fff}.qhd{display:flex;align-items:center;gap:6px;margin-bottom:4px}.qhd .grow{flex:1}.qtxt{white-space:pre-wrap;margin:2px 0 6px}
.ddb{border:1px solid #bdbdbd;border-top:0;border-radius:0 0 10px 10px;padding:8px 10px 6px;margin-bottom:4px}
.tk{display:inline-flex;align-items:center;gap:7px;margin:0;padding:7px 10px 7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14.5px;color:var(--ink);cursor:pointer}
.tk input{width:20px;height:20px;margin:0;accent-color:var(--pri)}
.tk.on{border-color:var(--pri);background:#eceef1;font-weight:600}
table.tb{width:100%;border-collapse:collapse;margin:4px 0;font-size:14px}
table.tb th{background:#e6e8eb;text-align:left;padding:6px;font-weight:600}table.tb td{padding:6px;border-top:1px solid var(--line)}
table.tb .c{text-align:center;width:70px}table.tb input{width:22px;height:22px;accent-color:var(--pri)}
.chk{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:14px;color:var(--ink)}.chk input{width:20px;height:20px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sub{background:#f7f8f9;border-bottom:1px solid var(--line);box-shadow:0 2px 4px rgba(0,0,0,.06)}
.subdesc{max-width:760px;margin:0 auto 8px;padding:0 30px 0 14px;font-size:13.5px;line-height:1.35;color:#2b2d31;cursor:pointer;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;position:relative}.subdesc.full{display:block;max-height:40vh;overflow:auto}.subdesc b{color:var(--pri)}.subdesc .dmore{position:absolute;right:12px;top:0;color:var(--mute);font-size:11px}
.fnav{display:flex;align-items:center;gap:6px;margin:0 auto;max-width:760px;padding:7px 14px}
.ancode{font-size:20px;font-weight:700;margin:2px 0 4px}.ancode .muted{font-size:12px;font-weight:400}
.desc{font-size:14px;margin-top:-2px}
table.st{border-collapse:collapse;margin:6px 0 12px;min-width:260px;font-size:13.5px}table.st th{background:var(--pri);color:#fff;text-align:left;padding:5px 8px;font-weight:600}table.st td{padding:4px 8px;border-bottom:1px solid var(--line)}table.st .n{text-align:right;width:60px}
.mapsaved{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:13px;color:var(--ok)}.mapsaved img{width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.tip{background:#eef3fb;border-color:#c9d8ef;font-size:14px}
.toast.undo{display:flex;gap:12px;align-items:center;background:#263238}.toast.undo button{min-height:34px;background:#fff;color:#263238;border-color:#fff;font-size:14px;padding:4px 12px}
.search{display:flex;gap:6px;margin:6px 0}.search input{flex:1}
.card.chk{background:#fff8e1;border-color:#e6cf7a}.card.chk.ok{background:var(--okbg);border-color:#cfe3d1;color:var(--ok);font-weight:600}.chkrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid #efe3b0;font-size:14px}.chkrow:first-of-type{border-top:0}.chkrow small{color:var(--mute)}
.helpbox{max-width:620px!important;max-height:88vh;overflow:auto}.helpbox details{border-top:1px solid var(--line);padding:8px 0}.helpbox summary{font-weight:700;cursor:pointer}.helpbox p{font-size:14px;line-height:1.5;margin:6px 0 0}
.lockrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
.steps3{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute)}.steps3 b{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--pri);color:#fff;font-size:11px;margin-right:4px}
.bar{height:8px;background:#e6e8eb;border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fafbfc}
.ph{position:relative}.ph.res img{opacity:.55;filter:grayscale(.5)}.phsel{position:absolute;top:6px;right:6px;padding:6px 9px;font-size:12px;border-radius:8px;border:1px solid #bbb;background:rgba(255,255,255,.92);color:#333;min-height:32px}.phsel.on{background:#2e7d32;border-color:#2e7d32;color:#fff}
.ph img{width:100%;height:150px;object-fit:cover;display:block;cursor:pointer}
.ph .cap{padding:6px 8px;font-size:13px;cursor:pointer;min-height:38px}
.gpsv{padding:8px 10px;background:#f4f5f6;border:1px solid var(--line);border-radius:8px;font-size:14px}
.msg{background:var(--warnbg);border:1px solid #e6cf7a;color:#5c4500;padding:8px 10px;border-radius:8px;font-size:13px}
.exp{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:10px 0}.exp button{min-width:250px;text-align:left}
.bkbar{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;background:#eef5ef;border:1px solid #cfe3d1;border-radius:10px;padding:10px 12px;margin:4px 0 12px}
.bkbar .btns{margin:4px 0}.bktxt b{display:block;font-size:14px}.bktxt span{font-size:12.5px;color:var(--mute)}
.bkbar.warn{background:#fff8e1;border-color:#e6cf7a}
.banner{background:#fff3cd;color:#7a4b00;padding:10px 14px;font-size:13px;border-bottom:1px solid #e0c36a}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:12px;padding:16px;max-width:420px;width:100%}.modal .btns{justify-content:flex-end}
.modal.zoom{background:rgba(0,0,0,.92)}.modal.zoom img{max-width:100%;max-height:100%}
.pmbox{max-width:620px!important;max-height:92vh;overflow:auto}.pmimg{width:100%;max-height:55vh;object-fit:contain;background:#eef0f2;border-radius:8px;display:block;margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}.cw{text-align:center;font-size:12px;color:var(--mute);font-weight:600}
.cd{padding:10px 0;text-align:center;font-size:15px;border-radius:8px;background:#fff;color:var(--ink);border:1px solid var(--line)}.cd.today{border:2px solid var(--pri)}.cd.sel{background:var(--pri);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#263238;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90%;font-size:14px}
.toast.err{background:var(--bad)}
.scroll{overflow-x:auto}table.prev{border-collapse:collapse;font-size:12px}table.prev td,table.prev th{border:1px solid #ddd;padding:4px;vertical-align:top}
.paper{background:#fff;padding:14px;border-radius:8px;font-family:Calibri,Carlito,Arial,sans-serif;font-size:12px;border:1px solid var(--line)}
table.ft{width:100%;border-collapse:collapse;table-layout:fixed;margin:0 0 18px}table.ft td{border:0;padding:4px 6px;vertical-align:top}
table.ft tr.h td{background:#404040;color:#fff;font-weight:700}table.ft tr.h small{font-weight:400;opacity:.85}
table.ft tr.c td{background:#efefef;padding:6px}table.c3{width:100%;border-collapse:collapse;table-layout:fixed}table.c3 td{width:33.3%;vertical-align:top;padding:5px 6px;font-size:12px}.lb{color:#404040;font-size:11px}.tt{display:block;font-size:12px;color:#000;margin:2px 0 3px}.tx{margin:0 0 2px;text-align:left}.tx.j{text-align:justify}.red{color:#c00000}
table.ft tr.pr td{text-align:center;vertical-align:middle;height:170px}table.ft tr.pr img{max-width:100%;max-height:165px}
table.ft tr.cap td,table.pg tr.cap td{text-align:left;font-style:italic;font-size:11px;vertical-align:top}
table.pg{width:100%;border-collapse:collapse;table-layout:fixed}table.pg td{border:0;padding:4px}table.pg tr.pr td{text-align:center;vertical-align:middle;height:150px}table.pg tr.pr img{max-width:100%;max-height:145px}.vis{margin:0 0 14px;font-size:12px}
.docxprev{background:#9a9da2;border-radius:10px;padding:10px 0;overflow:hidden;min-height:120px}.docxprev>p{padding:0 12px;color:#fff}
.docxprev .docx-wrapper{background:transparent!important;padding:0!important;display:flex;flex-direction:column;align-items:center}
.docxprev section.docx{box-shadow:0 2px 8px rgba(0,0,0,.35);margin:0 0 14px!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.fld{display:block}.fld>span{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 3px}

/* Relatório de Peritagem — réguas e menus a amarelo médio, texto escuro para contraste */
:root{--pri:#E3AE1F;--pri2:#E3AE1F;--priTx:#6b4f00;--bg:#f7f4ea;--line:#e2d9bf}#hdr{color:#1f2328}#hdr button{background:rgba(255,255,255,.5);color:#1f2328;border-color:rgba(0,0,0,.2)}#hdr button.on{background:#1f2328;color:#fff}h2{color:var(--priTx)}button,.btn{color:#1f2328;border-color:#c99a12}.secondary,button.sm,.btn:not(.green){background:#fff;color:var(--priTx);border-color:#d8c48a}.green,.pri{color:#fff;border-color:var(--ok)}.seg button{color:var(--priTx)}.seg button.on{background:var(--pri);color:#1f2328}.pill{color:var(--priTx)}.blk{color:#1f2328}table.st th{color:#1f2328}.steps3 b{color:#1f2328}.cd.sel{color:#1f2328}.subdesc b{color:var(--priTx)}details.sec>summary:before{color:var(--priTx)}.tk.on{background:#fbf3d6}
</style>
</head>
<body>
<div id="top"><div id="hdr"></div><nav id="steps"></nav><div id="sub"></div></div>

// Preenche um modelo .docx do utilizador: fichas no lugar de {{FICHAS}} (ou no fim do documento);
// {{PROCESSO}} {{DESIGNACAO}} {{LOCAL}} {{DATA}} {{DATA_HOJE}} são substituídos no corpo, cabeçalhos e rodapés.
async function buildDocxTpl(opts,tpl){
  const {body,media}=buildDocx({...opts,bodyOnly:true});
  const z=await unzip(tpl);const files=[];
  for(const n of z.names){if(n.endsWith('/'))continue;files.push({name:n,data:await z.get(n)})}
  const F=n=>files.find(f=>f.name===n);const T=f=>_dec.decode(f.data);
  const docF=F('word/document.xml');if(!docF)throw new Error('O modelo não é um documento Word (.docx) válido');
  const p=opts.proc,d=new Date();
  const vars={PROCESSO:p.codigo||'',DESIGNACAO:p.designacao||'',LOCAL:p.local||'',DATA:p.visita?.data||'',DATA_HOJE:`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`};
  const fillVars=x=>x.replace(/\{\{(\w+)\}\}/g,(m,k)=>k in vars?xesc(vars[k]):m);
  let doc=T(docF);
  const NS={wp:'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing',a:'http://schemas.openxmlformats.org/drawingml/2006/main',pic:'http://schemas.openxmlformats.org/drawingml/2006/picture',r:'http://schemas.openxmlformats.org/officeDocument/2006/relationships'};
  doc=doc.replace(/<w:document\b[^>]*>/,tag=>{let t=tag;for(const [k,u] of Object.entries(NS))if(!new RegExp('xmlns:'+k+'=').test(t))t=t.replace(/>$/,` xmlns:${k}="${u}">`);return t});
  const re=/<w:p\b(?:(?!<\/w:p>)[\s\S])*?\{\{FICHAS\}\}[\s\S]*?<\/w:p>/;
  if(re.test(doc))doc=doc.replace(re,()=>body);
  else{let i=doc.lastIndexOf('<w:sectPr');const e=doc.lastIndexOf('</w:body>');if(i<0||i>e)i=e;doc=doc.slice(0,i)+body+doc.slice(i)}
  docF.data=_enc.encode(fillVars(doc));
  for(const f of files)if(/^word\/(header|footer)\d*\.xml$/.test(f.name))f.data=_enc.encode(fillVars(T(f)));
  const relF=F('word/_rels/document.xml.rels');
  let rels=relF?T(relF):'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
  rels=rels.replace('</Relationships>',media.map(m=>`<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${m.name.slice(5)}"/>`).join('')+'</Relationships>');
  if(relF)relF.data=_enc.encode(rels);else files.push({name:'word/_rels/document.xml.rels',data:rels});
  const ctF=F('[Content_Types].xml');let ct=T(ctF);
  if(!/Extension="jpeg"/i.test(ct))ct=ct.replace('<Default ','<Default Extension="jpeg" ContentType="image/jpeg"/><Default ');
  ctF.data=_enc.encode(ct);
  for(const m of media)files.push({name:m.name,data:m.data});
  return zipStore(files);
}

// ---------- Análise em texto corrido (sem fotos) ----------
function analysisLines(proc,settings,anoms){
  const pf=printFields(proc,settings);const out=[];
  anoms.forEach((a,ix)=>{
    const code=a._code||('AN_'+String(a._n??(ix+1)).padStart(3,'0'));const zona=[a.zona,a.piso,a.local].filter(Boolean).filter((v,i,r)=>r.indexOf(v)===i).join(' · ');
    const it={title:`${code}${a._parte?` (${a._parte}${a.ref?' · Item '+a.ref:''})`:(a.ref?` · Item ${a.ref}`:'')} — ${[zona,a.elemento].filter(Boolean).join(' — ')}${a.origem==='local'?' [acrescentada no local]':''}`,lines:[]};
    if(a.descricao)it.lines.push([lblD(proc),a.descricao]);
    if(a.comentario)it.lines.push([(settings.dateCom!==false&&proc.visita?.data?proc.visita.data+' - ':'')+lblC(proc),a.comentario]);
    const car=[];for(const f of pf){if(f.id==='conf'&&a.origem==='local')continue;const t=fieldValueText(f,a.vals?.[f.id],settings,a.vals);if(!t)continue;if(f.type==='long')it.lines.push([f.label,t]);else car.push(`${f.label}: ${t}`)}
    if(car.length)it.lines.splice(a.comentario?2:(a.descricao?1:0),0,['Caracterização',car.join('; ')+'.']);
    out.push(it)});

function ordAnoms(p,L){const o=p.ordem||'lista';if(o==='lista')return L.map(a=>({...a,_grp:''}));
  const ci=(cat,v)=>{if(!v)return 1e6;const i=(settings[cat]||[]).indexOf(v);return i<0?1e5:i};const fo=id=>settings.fields.find(f=>f.id===id);
  const optI=(id,v)=>{const f=fo(id);if(!v||!f)return 1e6;const i=(f.opts||[]).findIndex(x=>x[0]===v);return i<0?1e5:i};
  const optT=(id,v)=>{const f=fo(id);const x=(f?.opts||[]).find(x=>x[0]===v);return x?optText(x,settings.printStyle):v};
  const firstOpt=(id,arr)=>{const f=fo(id);const a=(arr||[]).filter(v=>v!=='OUT');if(!a.length)return '';return [...a].sort((x,y)=>optI(id,x)-optI(id,y))[0]};
  const K=a=>{switch(o){
    case 'hier':return {k:[ci('catZona',a.zona),a.zona||'',ci('catPiso',a.piso),a.piso||'',ci('catLocal',a.local),a.local||'',ci('catElem',a.elemento),a.elemento||''],g:[a.zona,a.piso,a.local,a.elemento].filter(Boolean).join('  ›  ')||'(sem identificação)'};
    case 'zona':return {k:[ci('catZona',a.zona),a.zona||''],g:'NUF: '+(a.zona||'(sem NUF)')};
    case 'local':return {k:[ci('catLocal',a.local),a.local||''],g:'Local: '+(a.local||'(sem local)')};
    case 'elemento':return {k:[ci('catElem',a.elemento),a.elemento||''],g:'Elemento: '+(a.elemento||'(sem elemento)')};
    case 'tipo':{const t=(a.vals?.tipo||[])[0]||'';return {k:[ci('catalog',t),t],g:(fo('tipo')?.label||'Tipo')+': '+(t||'(sem tipo)')}}
    case 'grav':{const v=firstOpt('cons',a.vals?.cons);return {k:[optI('cons',v)],g:(fo('cons')?.label||'Gravidade')+': '+(v?optT('cons',v):'(sem classificação)')}}
    case 'urg':{const v=a.vals?.urg;return {k:[optI('urg',v)],g:(fo('urg')?.label||'Urgência')+': '+(v?optT('urg',v):'(sem classificação)')}}
    case 'parte':{const n=parteOf(p,a);return {k:[n],g:`Parte ${n} – ${parteNome(p,n)||''}`}}}};
  const cmp=(x,y)=>{for(let i=0;i<Math.max(x.length,y.length);i++){if(x[i]===y[i])continue;if(typeof x[i]==='number'&&typeof y[i]==='number')return x[i]-y[i];return String(x[i]).localeCompare(String(y[i]),'pt')}return 0};
  return L.map((a,i)=>({a,i,...K(a)})).sort((x,y)=>cmp(x.k,y.k)||x.i-y.i).map(x=>({...x.a,_grp:x.g}))}

function migrateSettings(s){
  s=Object.assign(clone(DEF_SETTINGS),s||{});
  for(const df of DEF_FIELDS)if(!s.fields.find(f=>f.id===df.id)&&!(s.removed||[]).includes(df.id))s.fields.push(clone(df));
  if(!s.mig0110){s.catalog=clone(DEF_CATALOG);s.catZona=clone(DEF_ZONA);s.catPiso=clone(DEF_PISO);s.catLocal=clone(DEF_LOCAL);s.catElem=clone(DEF_ELEM);s.mig0110=true}
  if(!s.mig092){const c=s.fields.find(f=>f.id==='conf');if(c&&c.opts)c.opts=c.opts.map(([k,t])=>k==='CON'?['CFM',t==='Confirma-se'?'Confirmado':t]:[k,t]);s.mig092=true}
  if(!s.mig080){s.onePerPage=true;s.fitPage=true;s.mig080=true}
  s.fields=s.fields.filter(f=>f.id!=='grav');s.removed=[...new Set([...(s.removed||[]),'grav'])];
  if(!s.mig064){ // funcional passa a 6-7-8 (4 e 5 ficam livres)
    const c=s.fields.find(f=>f.id==='cons');const M={'4-FNR':'6-FNR','5-FPR':'7-FPR','6-FRV':'8-FRV'};
    if(c&&s.mig063)c.opts=c.opts.map(([k,t])=>[M[k]||k,t]);s.mig064=true}
  if(!s.mig063){ // Gravidade graduada (1–6, estético/funcional) substitui PER/PEI/PFR/PFI e a gravidade antiga
    const c=s.fields.find(f=>f.id==='cons');
    if(c){const codes=(c.opts||[]).map(o=>o[0]).join();if(codes==='PER,PEI,PFR,PFI,OUT'||codes==='PER,PEI,PFR,PFI'){c.opts=clone(DEF_FIELDS.find(f=>f.id==='cons').opts);c.free='OUT'}if(c.label==='Consequências')c.label='Gravidade';c.excl=true}
    const g=s.fields.find(f=>f.id==='grav');if(g&&g.label==='Gravidade'){g.label='Gravidade (escala antiga)';g.on=false;g.print=false}
    s.mig063=true}
  if(!s.mig062){ // consequências: um só campo na grelha de validação, com 5 hipóteses (inclui "Outras" com rótulo livre)
    const nf=s.fields.find(f=>f.id==='cons')||clone(DEF_FIELDS.find(f=>f.id==='cons'));
    const k=s.fields.findIndex(f=>['prej','cEst','cFun'].includes(f.id));const olds=s.fields.filter(f=>['prej','cEst','cFun'].includes(f.id));
    if(olds.length){nf.on=olds.some(f=>f.on);nf.print=olds.some(f=>f.print)}
    s.fields=s.fields.filter(f=>!['prej','cEst','cFun','cons'].includes(f.id));
    const at=k>=0?k:(s.fields.findIndex(f=>f.id==='estado')+1||s.fields.length);s.fields.splice(at,0,nf);
    s.removed=(s.removed||[]).filter(x=>x!=='cons');s.mig062=s.mig061=true}
  if(!s.mig0165){const c=s.fields.find(f=>f.id==='conf');if(c&&Array.isArray(c.opts)&&!c.opts.some(o=>o[0]==='NCF')){const at=c.opts.findIndex(o=>o[0]==='CFM');c.opts.splice(at>=0?at+1:c.opts.length,0,['NCF','Não confirmado'])}s.mig0165=true}
  if(!s.mig0163){const c=s.fields.find(f=>f.id==='conf');if(c&&Array.isArray(c.opts)){const ks=c.opts.map(o=>o[0]);const add=[['EEX','Em execução'],['STB','Em stand-by']].filter(o=>!ks.includes(o[0]));if(add.length){const at=ks.indexOf('RES');c.opts.splice(at>=0?at+1:c.opts.length,0,...add)}}s.mig0163=true}
  if(!s.mig060){const c=s.fields.find(f=>f.id==='conf');if(c&&c.opts&&c.opts.map(o=>o[0]).join()==='CON,NID'){c.opts=clone(DEF_FIELDS[0].opts);if(c.label==='Confirmação')c.label='Status'}if(s.maxFotos===4)s.maxFotos=9;s.mig060=true}
  return s;
}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Imagem não suportada (HEIC no PC? converta para JPG)'));i.src=src})}
async function compressImage(file,kb){
  let src;try{src=await createImageBitmap(file)}catch(e){const u=URL.createObjectURL(file);try{src=await loadImg(u)}finally{setTimeout(()=>URL.revokeObjectURL(u),1000)}}
  const W0=src.width||src.naturalWidth,H0=src.height||src.naturalHeight;
  let maxD=kb<=50?700:kb<=150?1000:kb<=300?1200:1500;let last;
  for(let pass=0;pass<4;pass++){
    const sc=Math.min(1,maxD/Math.max(W0,H0));const w=Math.round(W0*sc),h=Math.round(H0*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(src,0,0,w,h);
    for(const q of [.82,.72,.62,.52,.44]){const d=c.toDataURL('image/jpeg',q);last={data:d,w,h};if(d.length*0.75<=kb*1024)return last}
    maxD=Math.round(maxD*0.8);
  }
  return last;
}
// ---------- fotos repetidas: assinatura visual (dHash 64 bits) — apanha a mesma imagem mesmo que reimportada noutra qualidade ----------
async function phash(src){const i=await loadImg(src);const c=document.createElement('canvas');c.width=9;c.height=8;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(i,0,0,9,8);
  const d=x.getImageData(0,0,9,8).data;const g=k=>d[k*4]*0.299+d[k*4+1]*0.587+d[k*4+2]*0.114;let h='';
  for(let r=0;r<8;r++){let n=0;for(let cc=0;cc<8;cc++)n=(n<<1)|(g(r*9+cc)>g(r*9+cc+1)?1:0);h+=n.toString(16).padStart(2,'0')}return h}
const hamm=(a,b)=>{let n=0;for(let i=0;i<a.length;i+=2){let v=parseInt(a.substr(i,2),16)^parseInt(b.substr(i,2),16);while(v){n+=v&1;v>>=1}}return n};
const SAME=2;
async function ensureHashes(p){let ch=false;for(const a of p.anomalias)for(const f of a.fotos)if(!f.ph){try{const src=fd(f)||(await fotoGet(f.id))?.data;if(src){f.ph=await phash(src);ch=true}}catch(e){}}return ch}
function dupGroups(p){const L=[];p.anomalias.forEach(a=>relF(a).forEach((f,i)=>{if(f.ph)L.push({a,f,i,code:imgCode(p,a,i)})}));const G=[],used=new Set();
  for(let x=0;x<L.length;x++){if(used.has(x))continue;const g=[L[x]];for(let y=x+1;y<L.length;y++)if(!used.has(y)&&hamm(L[x].f.ph,L[y].f.ph)<=SAME){g.push(L[y]);used.add(y)}if(g.length>1)G.push(g)}return G}
function dupOf(p,f){const out=[];p.anomalias.forEach(a=>a.fotos.forEach((g,i)=>{if(g!==f&&g.id!==f.id&&g.ph&&f.ph&&hamm(g.ph,f.ph)<=SAME)out.push(fotoLbl(p,a,i))}));return out}

<details><summary>1 · Processo</summary><p><b>A</b> — dados do processo e da vistoria: data (📅), presenças e localização GPS («📍 Obter GPS», ou colar coordenadas / link do Google Maps). O mapa de satélite fica guardado para o Word.<br><b>B</b> — <b>Partes</b>: cada parte tem um prefixo (1 Autor, 2 Réu, 3 Tribunal, 4 Perito). Os <b>Campos a atender</b> escolhem o que se aprecia em cada anomalia. A <b>Lógica da ficha</b> escolhe os títulos: Situação/Análise ou Questão/Resposta.</p></details>
<details><summary>2 · Anomalias</summary><p><b>Importar lista</b> de Excel ou Word (tabela, lista numerada ou parágrafos numerados) e escolher de que parte é — os códigos ficam 1.001, 1.002… / 2.001… Também se acrescentam à mão («+ Acrescentar anomalia»; as constatadas no local vão para a parte do Perito).<br>Toque numa anomalia para se pronunciar: a situação fica fixa no topo; ◀ ▶ passa à anterior/seguinte. <b>⧉ Copiar a pronúncia</b> repete a classificação da anomalia anterior. Até 9 fotos (câmara ou fototeca); toque na foto para legendar, rodar, mover para outra anomalia ou eliminar.<br><b>🔍 Pesquisa</b> e filtros (por analisar, parte, zona). <b>🔒 Fixar numeração</b> congela os códigos. Ao eliminar, há 10 s para <b>↶ Desfazer</b>.</p></details>
<details><summary>3 · Relatório</summary><p>O quadro <b>«Antes de exportar»</b> mostra o que falta (por analisar, sem fotos, fotos sem legenda…). Pré-visualização do Word real; Word com fichas (uma por página, fotos em 1/2/3 colunas) e/ou análise em texto corrido; Excel; pasta completa (.zip) com fotos IMG 1.001.1…</p></details>
<details><summary>Cópias e passagem entre aparelhos</summary><p><b>Backup OUT/IN</b> — todos os processos. <b>📤 Enviar</b> (em cada processo) cria um ficheiro só com esse processo, para passar ao iPad/PC por AirDrop ou iCloud; no outro aparelho, <b>📥 Receber processo</b> compara as datas e pergunta se substitui ou mantém os dois. Trabalhe cada processo num aparelho de cada vez.</p></details>
<details><summary>Instalação e atualizações</summary><p>Abra pelo ícone do ecrã principal (não pela app Ficheiros). As versões novas instalam-se sozinhas quando abre a app com rede. Os dados ficam só neste aparelho.</p></details>`;

}

  ${S.view==='anom'?`<div class="mv"><button class="secondary mini" data-act="mvA" data-id="${a.id}" data-d="-1" ${i?'':'disabled'}>▲</button><button class="secondary mini" data-act="mvA" data-id="${a.id}" data-d="1" ${i<n-1?'':'disabled'}>▼</button><button class="del" data-act="delA" data-id="${a.id}">🗑</button></div>`:''}</div></div>`;
}

  ${an.length>3?addBtns(p,true):''}

function tickBox(name,checked,label,attrs){return `<label class="tk ${checked?'on':''}"><input type="checkbox" ${checked?'checked':''} ${attrs}><span>${label}</span></label>`}

function openCalendar(cur0,onPick){
  const m0=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(cur0||'').trim());let d=m0?new Date(+m0[3],+m0[2]-1,+m0[1]):new Date();let y=d.getFullYear(),m=d.getMonth();
  const sel=m0?`${+m0[3]}-${+m0[2]-1}-${+m0[1]}`:'';const pad=n=>String(n).padStart(2,'0');
  const box=document.createElement('div');box.className='modal';
  const draw=()=>{const first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),t=new Date(),tk=`${t.getFullYear()}-${t.getMonth()}-${t.getDate()}`;
    let h=`<div class="box"><div class="row" style="justify-content:space-between"><button class="sm" data-c="prev">◀</button><b style="text-transform:capitalize">${first.toLocaleDateString('pt-PT',{month:'long',year:'numeric'})}</b><button class="sm" data-c="next">▶</button></div><div class="cal">${['S','T','Q','Q','S','S','D'].map(x=>`<div class="cw">${x}</div>`).join('')}`;
    for(let i=0;i<start;i++)h+='<div></div>';
    for(let dd=1;dd<=days;dd++){const k=`${y}-${m}-${dd}`;h+=`<button class="cd ${k===tk?'today':''} ${k===sel?'sel':''}" data-d="${dd}">${dd}</button>`}
    h+=`</div><div class="btns"><button data-c="close">Fechar</button><button data-c="today">Hoje</button></div></div>`;box.innerHTML=h};
  box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target===box)box.remove();return}
    if(b.dataset.d){box.remove();onPick(`${pad(+b.dataset.d)}/${pad(m+1)}/${y}`);return}
    const c=b.dataset.c;if(c==='prev'){m--;if(m<0){m=11;y--}draw()}else if(c==='next'){m++;if(m>11){m=0;y++}draw()}else if(c==='today'){const t=new Date();box.remove();onPick(`${pad(t.getDate())}/${pad(t.getMonth()+1)}/${t.getFullYear()}`)}else box.remove()});
  draw();document.body.appendChild(box);
}

  if(act==='tickPage'){settings.onePerPage=el.checked;await saveSettings();S.scrollTop=window.scrollY;render();return}
  if(act==='pmRepCam'||act==='pmRepLib'){const i=+el.dataset.i;const file=el.files[0];el.value='';const old=a.fotos[i];if(!file||!old)return;

      if(act==='pmRepCam'){S.camShots.push(file);gpsAutoFromCamera(p)}await saveProc();S.scrollTop=window.scrollY;render();openPhotoModal(i);

    catch(err){toast(err.message,1)}return}
  if(act==='addCam'||act==='addLib'){

  if(act==='impSheet'){const i=+el.value;setImport(S.imp.sheets[i].rows,S.imp.sheets,i);render();return}
  if(act==='impHdr'){S.imp.hdr=+el.value;render();return}

    if(d.kind==='processo'){const pp=d.procs[0];const ex=procs.find(x=>x.id===pp.id);let mode=2;

      if(ex&&mode===1){pp.id=uid();pp.codigo=(pp.codigo||'')+' (recebido)';for(const a of pp.anomalias)for(const f of a.fotos)f.id=uid();if(pp.visita?.map)pp.visita.map.id='map_'+pp.id}
      if(ex&&mode===2){for(const a of ex.anomalias)for(const f of a.fotos)await fotoDel(f.id)}
      migrateProc(pp);await migrateFotos(pp);await dbPut(pp);const k=procs.findIndex(x=>x.id===pp.id);k>=0?procs[k]=pp:procs.push(pp);S.prevNode=null;
      toast(`Processo ${pp.codigo||''} recebido (${pp.anomalias.length} anomalias).`);render();return}
    const ch=await ask(`Cópia de ${String(d.date||'').slice(0,10)} com ${d.procs.length} processo(s).\nAcrescentar aos atuais (processos com o mesmo identificador são atualizados) ou substituir tudo?`,['Cancelar','Substituir tudo','Acrescentar']);if(!ch)return;
    if(ch===1){for(const p0 of procs){for(const a of p0.anomalias)for(const f of a.fotos)await fotoDel(f.id);await dbDel(p0.id)}procs=[];settings=migrateSettings(d.settings);await saveSettings()}
    for(const pp of d.procs){migrateProc(pp);await migrateFotos(pp);await dbPut(pp);const k=procs.findIndex(x=>x.id===pp.id);k>=0?procs[k]=pp:procs.push(pp)}
    toast('Cópia reposta.');render()}catch(err){toast('Erro: '+err.message,1)}return}
  if(el.dataset.set){const k=el.dataset.set;settings[k]=k==='printStyle'?el.value:+el.value;await saveSettings();return}
  if(el.dataset.catedit){const ck=el.dataset.catedit,i=+el.dataset.i,v=el.value.trim();if(v)settings[ck][i]=v;else el.value=settings[ck][i];await saveSettings();return}

});
function autosize(t){if(!t||t.tagName!=='TEXTAREA')return;t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'}
document.addEventListener('toggle',e=>{if(e.target.open)e.target.querySelectorAll?.('textarea').forEach(autosize)},true);
document.addEventListener('input',e=>{
  autosize(e.target);if(e.target.id==='fq'){S.filt.q=e.target.value;const pos=e.target.selectionStart;S.scrollTop=window.scrollY;render();const f=$('#fq');if(f){f.focus();try{f.setSelectionRange(pos,pos)}catch(_){}}return}const el=e.target,b=el.dataset.bind;if(!b)return;const p=cur(),a=curA();
  const [scope,k,k2]=b.split('.');
  if(scope==='p')p[k]=el.value;else if(scope==='vis')p.visita[k]=el.value;else if(scope==='a')a[k]=el.value;else if(scope==='v'){a.vals=a.vals||{};a.vals[k]=el.value}else if(scope==='f')a.fotos[+k][k2]=el.value;
  else if(scope==='r'){ensureRel(p)[k]=el.value}else if(scope==='q'){ensureRel(p).quesitos[+k][k2]=el.value}else if(scope==='qp'){const q=ensureRel(p).quesitos[+k];q.rp=q.rp||{};q.rp[k2]=el.value}else if(scope==='pe'){ensureRel(p).peritos[+k][k2]=el.value}else if(scope==='s'){settings[k]=el.value;saveSettings();return}
  saveProcSoon();
});

(async()=>{
  try{await idbOpen();settings=migrateSettings(await kvGet('settings'));await saveSettings();procs=(await dbAll()||[]).map(migrateProc);for(const pp of procs)await migrateFotos(pp);try{tplBytes=(await kvGet('tpl'))||null}catch(_){}navigator.storage?.persist?.()}
